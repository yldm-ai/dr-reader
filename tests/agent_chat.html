<!doctype html>
<meta charset="utf-8">
<title>Agent reading assistance</title>
<pre id="result">RUNNING</pre>
<script type="module">
const output = document.getElementById('result');
const check = (value, label) => { if (!value) throw Error(label); };
const until = async (predicate, label = 'Timed out waiting for bundled application') => {
  for (let i = 0; i < 300; i++) {
    if (predicate()) return;
    await new Promise(resolve => setTimeout(resolve, 30));
  }
  throw Error(label);
};
try {
  const frame = document.createElement('iframe');
  frame.style.cssText = 'width:1200px;height:800px;border:0';
  let html = await (await fetch('../dist/index.html')).text();
  html = html.replace('<head>', `<head><base href="${location.origin}/dist/"><script type="module" src="/tests/native-mock.ts"><\/script>`);
  frame.srcdoc = html;
  document.body.append(frame);
  await until(() => frame.contentDocument.querySelector('.book-card'));
  const doc = frame.contentDocument;
  const win = frame.contentWindow;
  const probe = win.nativeProbe;
  const asks = () => probe.requests.filter(item => item.method === 'agent.ask');

  // Settings: detection, the agent choice and a per-CLI model.
  doc.getElementById('open-settings').click();
  doc.getElementById('app-tab-agent').click();
  check(!doc.getElementById('app-section-agent').hidden && doc.getElementById('app-section-appearance').hidden, 'the AI 助读 tab shows only its group');
  await until(() => doc.querySelectorAll('#app-agent-status li[data-found]').length === 3, 'agent detection listed');
  const status = [...doc.querySelectorAll('#app-agent-status li')].map(item => item.dataset.found);
  check(status.join() === 'true,false,true', `detected agents shown: ${status}`);
  check(doc.querySelector('#app-agent-status li small').textContent.includes('C:/fake/codex.exe'), 'detected path shown');
  const model = doc.getElementById('app-agent-model');
  const trigger = doc.getElementById('app-agent-model-trigger');
  const effort = doc.getElementById('app-agent-effort');
  const effortTrigger = doc.getElementById('app-agent-effort-trigger');
  const modelStatus = () => doc.getElementById('app-agent-model-status').textContent;
  const effortStatus = () => doc.getElementById('app-agent-effort-status').textContent;
  const modelQueries = () => probe.requests.filter(item => item.method === 'agent.models');
  const saved = () => probe.data.settings.application;
  check(model.disabled && trigger.disabled && effort.disabled && effortTrigger.disabled, 'automatic choice has no model or effort to choose');
  check(!modelQueries().length, 'automatic choice queries no CLI');
  const agent = doc.getElementById('app-agent');
  const choose = value => { agent.value = value; agent.dispatchEvent(new win.Event('change', { bubbles: true })); };
  const pick = async (kind, label) => {
    doc.getElementById(`app-agent-${kind}-trigger`).click();
    const rows = () => [...doc.querySelectorAll(`#app-agent-${kind}-options .select-option`)];
    await until(() => rows().some(row => row.textContent === label), `${kind} option ${label}`);
    rows().find(row => row.textContent === label).click();
  };
  const values = select => [...select.options].map(option => option.value).join();
  choose('claude');
  check(modelStatus().includes('正在查询'), 'model query in progress');
  await until(() => !model.disabled && [...model.options].some(option => option.value === 'sonnet'), 'choosing a CLI lists its models');
  check(modelQueries().at(-1).params.agent === 'claude', 'models asked from the chosen CLI');
  check(model.options[0].text === '默认（Opus 5.5）' && trigger.textContent === '默认（Opus 5.5）', 'the CLI default is named');
  check(modelStatus() === '共 2 个可用模型', `model count shown: ${modelStatus()}`);
  check(values(effort) === ',low,medium,high,*custom' && effortStatus() === 'Opus 5.5 支持 3 档', 'efforts follow the default model');
  await pick('model', 'Sonnet 5.5（sonnet）');
  await until(() => saved().agent === 'claude' && saved().agentModels?.claude === 'sonnet', 'listed model saved');
  await until(() => values(effort) === ',low,max,*custom', 'efforts follow the chosen model');
  check(effort.options[0].text === '模型的默认强度' && effort.options[2].text === '最高（max）', 'efforts are named');

  // Efforts: a listed one, one the next model does not accept, and a typed one.
  await pick('effort', '最高（max）');
  await until(() => saved().agentEfforts?.claude === 'max', 'listed effort saved');
  await pick('model', 'Opus 5.5（opus）');
  await until(() => saved().agentModels.claude === 'opus' && saved().agentEfforts.claude === '' && effortTrigger.textContent === '模型的默认强度',
    'an effort the new model does not accept falls back to its default');
  const effortRow = doc.getElementById('app-agent-effort-custom-row');
  const effortInput = doc.getElementById('app-agent-effort-custom');
  const type = (field, value) => { field.value = value; field.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); };
  check(effortRow.hidden, 'effort typing is hidden until asked for');
  await pick('effort', '其他强度…');
  await until(() => !effortRow.hidden && doc.activeElement === effortInput, 'other effort field shown and focused');
  type(effortInput, 'high max');
  await until(() => doc.querySelector('.toast-message')?.textContent.includes('思考强度'), 'unsafe effort rejected');
  check(saved().agentEfforts.claude === '', 'rejected effort not saved');
  type(effortInput, 'turbo');
  await until(() => saved().agentEfforts.claude === 'turbo' && effortRow.hidden && effortTrigger.textContent === 'turbo（自定义）', 'other effort saved');

  // A model the CLI did not list can still be typed; a typed effort is kept for it.
  const customRow = doc.getElementById('app-agent-model-custom-row');
  const custom = doc.getElementById('app-agent-model-custom');
  check(customRow.hidden, 'typing is hidden until asked for');
  await pick('model', '其他模型…');
  await until(() => !customRow.hidden && doc.activeElement === custom, 'other model field shown and focused');
  type(custom, 'a;b');
  await until(() => [...doc.querySelectorAll('.toast-message')].some(item => item.textContent.includes('模型名称')), 'unsafe model rejected');
  check(saved().agentModels.claude === 'opus', 'rejected model not saved');
  type(custom, 'opus[1m]');
  await until(() => saved().agentModels.claude === 'opus[1m]' && customRow.hidden, 'other model saved');
  await until(() => trigger.textContent === 'opus[1m]（自定义）', 'saved custom model shown in the list');
  check(saved().agentEfforts.claude === 'turbo' && effortStatus().includes('手动指定'), 'an unknown model keeps the typed effort');

  // A failed query explains itself; re-detecting the tools retries it, and the model refresh asks again.
  probe.data.agentModelsError = { codex: '请先运行 codex login' };
  choose('codex');
  await until(() => modelStatus().includes('请先运行 codex login'), 'model query failure shown');
  check(values(model) === ',*custom' && values(effort) === ',*custom', 'defaults and other remain after a failure');
  probe.data.agentModelsError = {};
  const detections = probe.requests.filter(item => item.method === 'agent.detect').length;
  const detect = doc.getElementById('app-agent-detect');
  detect.click();
  check(detect.disabled && doc.querySelector('#app-agent-status small').textContent === '正在检测…', 'detection runs again');
  await until(() => !detect.disabled && doc.querySelectorAll('#app-agent-status li[data-found]').length === 3, 'detection finished');
  check(probe.requests.filter(item => item.method === 'agent.detect').length === detections + 1, 'detection asked the host again');
  await until(() => [...model.options].some(option => option.value === 'gpt-6-astra'), 're-detection retries the failed model list');
  check(effort.options[0].text === '默认（低）', `codex default effort named: ${effort.options[0].text}`);
  const refreshed = modelQueries().length;
  doc.getElementById('app-agent-model-refresh').click();
  await until(() => modelQueries().length === refreshed + 1 && !doc.getElementById('app-agent-model-refresh').disabled, 'model refresh asks again');
  const queries = modelQueries().length;
  choose('claude');
  await until(() => trigger.textContent === 'opus[1m]（自定义）');
  check(modelQueries().length === queries, 'model lists are kept for the session');
  doc.getElementById('application-settings-close').click();

  // Ask about a selected passage.
  doc.querySelector('.book-card').click();
  await until(() => !doc.getElementById('reader-view').hidden && doc.getElementById('reader-loading').hidden);
  const book = doc.getElementById('book-frame').contentDocument;
  const paragraph = book.querySelector('p');
  const range = book.createRange();
  range.setStart(paragraph.firstChild, 0); range.setEnd(paragraph.firstChild, 10);
  book.getSelection().removeAllRanges(); book.getSelection().addRange(range);
  paragraph.dispatchEvent(new book.defaultView.MouseEvent('mouseup', { bubbles: true }));
  await until(() => !doc.getElementById('selection-menu').hidden, 'selection menu opens');
  check(!doc.getElementById('selection-ask').hidden, '问 AI is offered');
  doc.getElementById('selection-ask').click();
  await until(() => !doc.getElementById('ask-content').hidden, 'ask tab opens');
  const quote = doc.querySelector('.ask-quote');
  check(!quote.hidden && quote.textContent.includes('阅读是一段安静的时光'), 'selected passage attached');
  check(doc.activeElement === doc.querySelector('.ask-input'), 'composer focused');
  const input = doc.querySelector('.ask-input');
  const submit = text => { input.value = text; input.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true })); };
  submit('这句话想表达什么？');
  await until(() => doc.querySelector('.ask-answer-body strong')?.textContent === '要点', 'markdown answer streamed');
  await until(() => doc.querySelector('.ask-copy'), 'answer completes');
  check(doc.querySelectorAll('.ask-answer-body li').length === 2, 'answer list rendered');
  check(doc.querySelector('.ask-meta').textContent.includes('Codex'), 'agent label shown');
  check(quote.hidden, 'quote cleared after asking');
  const askPanel = doc.getElementById('toc-panel');
  const askBody = doc.querySelector('.ask-body');
  const askForm = doc.querySelector('.ask-form');
  const panelRect = askPanel.getBoundingClientRect();
  const bodyRect = askBody.getBoundingClientRect();
  const formRect = askForm.getBoundingClientRect();
  check(askPanel.dataset.tab === 'ask' && win.getComputedStyle(askBody).overflowY === 'auto',
    'ask conversation has its own scroll viewport');
  check(Math.abs(bodyRect.bottom - formRect.top) <= 1, 'conversation scrolls only above the composer');
  check(Math.abs(formRect.bottom - panelRect.bottom) <= 2, 'composer surface reaches the panel bottom');
  const first = asks()[0].params;
  check(first.agent === 'claude' && first.model === 'opus[1m]' && first.effort === 'turbo', 'configured agent, model and effort sent');
  check(first.prompt.includes('<selection>\n阅读是一段安静的时光') && first.prompt.includes('读者的问题：这句话想表达什么？'), 'passage and question in prompt');
  check(first.prompt.includes('《阅读与时光》') && first.prompt.includes('<chapter>') && first.prompt.includes('原创的阅读测试文字'), 'book and chapter text in prompt');

  // A follow-up replays the conversation.
  submit('能再举个例子吗？');
  await until(() => asks().length === 2 && doc.querySelectorAll('.ask-copy').length === 2, 'follow-up answered');
  const second = asks()[1].params.prompt;
  check(second.includes('<conversation>') && second.includes('读者：（关于「阅读是一段安静的时光」）这句话想表达什么？') && second.includes('助手：**要点**'), 'history replayed');

  // Stopping keeps what arrived and frees the composer.
  probe.data.agentSlow = true;
  submit('慢慢说');
  await until(() => doc.querySelector('.ask-panel').dataset.busy === 'true' && doc.querySelectorAll('.ask-answer-body')[2]?.textContent.includes('这是'), 'slow answer started');
  check(doc.querySelector('.ask-send').getAttribute('aria-label') === '停止回答', 'send turns into stop');
  doc.querySelector('.ask-send').click();
  await until(() => probe.requests.some(item => item.method === 'agent.cancel'), 'cancel sent');
  await until(() => doc.querySelector('.ask-panel').dataset.busy === 'false');
  check(doc.querySelectorAll('.ask-meta')[2].textContent.includes('已停止'), 'stopped answer marked');
  check(!doc.querySelector('.ask-error'), 'stopping is not an error');
  probe.data.agentSlow = false;

  // Failures explain themselves and can be retried.
  probe.data.agentError = '模型服务暂时不可用';
  submit('出错的问题');
  await until(() => doc.querySelector('.ask-error')?.textContent === '模型服务暂时不可用', 'error shown');
  probe.data.agentError = '';
  [...doc.querySelectorAll('.ask-failed .text-button')].find(button => button.textContent === '重试').click();
  await until(() => asks().length === 5 && !doc.querySelector('.ask-failed') && doc.querySelectorAll('.ask-copy').length === 4, 'retry succeeds');
  check(!asks()[4].params.prompt.includes('出错的问题？'), 'failed exchange not replayed');
  check(asks()[4].params.prompt.includes('读者的问题：出错的问题'), 'retry asks the same question');

  // Every finished answer saved the conversation; the failed attempt was not.
  const sessions = () => Object.values(probe.data.conversations ?? {});
  const saves = () => probe.requests.filter(item => item.method === 'conversation.save');
  await until(() => sessions()[0]?.messages.length === 8, 'conversation saved after each answer');
  check(saves().length === 4 && saves().every(item => item.params.id === 'fixture'), 'saved to the open book');
  const conversation = sessions()[0];
  check(conversation.title === '这句话想表达什么？' && conversation.messages[0].quote.startsWith('阅读是一段安静的时光'), 'titled by the first question, with its passage');
  check(conversation.messages[1].agent === 'codex' && conversation.messages[1].label === 'Codex' && conversation.messages[1].model === 'opus[1m]' && conversation.messages[1].effort === 'turbo',
    'answers record the CLI, model and effort');
  check(conversation.messages[5].stopped === true && conversation.messages.filter(item => item.text === '出错的问题').length === 1, 'stopped answers kept, failed attempt not');

  // A new conversation starts empty; the earlier one stays in the history.
  doc.querySelector('.ask-reset').click();
  check(!doc.querySelector('.ask-turn') && doc.querySelector('#ask-content .panel-hint'), 'new conversation clears the thread');
  submit('换个话题');
  await until(() => sessions().length === 2 && doc.querySelectorAll('.ask-copy').length === 1, 'second conversation saved');
  check(!asks().at(-1).params.prompt.includes('<conversation>'), 'a new conversation replays nothing');
  const historyButton = doc.querySelector('.ask-history-open');
  historyButton.click();
  const rows = () => [...doc.querySelectorAll('.ask-history-row')];
  await until(() => rows().length === 2, 'history lists both conversations');
  check(doc.querySelector('.ask-thread').hidden && historyButton.getAttribute('aria-pressed') === 'true', 'history replaces the thread');
  check(rows()[0].dataset.current === 'true' && rows()[0].textContent.includes('换个话题') && rows()[1].textContent.includes('4 问'),
    `newest first, current marked, questions counted: ${rows().map(row => row.textContent).join(' | ')}`);
  rows()[1].querySelector('.ask-history-item').click();
  await until(() => !doc.querySelector('.ask-thread').hidden && doc.querySelectorAll('.ask-copy').length === 4, 'earlier conversation reopened');
  check(doc.querySelector('.ask-turn-quote')?.textContent.startsWith('阅读是一段安静的时光') && doc.querySelectorAll('.ask-meta')[2].textContent.includes('已停止'),
    'reopened conversation shows passages and stopped answers');
  submit('接着上次问');
  await until(() => doc.querySelectorAll('.ask-copy').length === 5, 'follow-up in a reopened conversation');
  const resumed = asks().at(-1).params.prompt;
  check(resumed.includes('<conversation>') && resumed.includes('这句话想表达什么？') && resumed.includes('（回答被读者中途停止）'), 'reopened history is replayed');
  await until(() => probe.data.conversations[conversation.id].messages.length === 10, 'the reopened conversation grows');

  // Reopening the book continues its latest conversation.
  doc.getElementById('back-library').click();
  await until(() => !doc.getElementById('library-view').hidden, 'back to the library');
  doc.querySelector('.book-card').click();
  await until(() => !doc.getElementById('reader-view').hidden && doc.getElementById('reader-loading').hidden);
  doc.querySelector('[data-tab="ask"]').click();
  // The sidebar folds away on opening; pointing at the window edge brings it back, as for a reader.
  doc.getElementById('toc-reveal-zone').dispatchEvent(new win.PointerEvent('pointerenter', { clientX: 2, clientY: 400 }));
  await until(() => doc.getElementById('toc-panel').dataset.expanded === 'true', 'sidebar revealed');
  await until(() => doc.querySelectorAll('.ask-copy').length === 5, 'latest conversation restored after reopening');

  // Deleting: another conversation, then the open one.
  historyButton.click();
  await until(() => rows().length === 2);
  rows().find(row => row.textContent.includes('换个话题')).querySelector('.ask-history-delete').click();
  await until(() => rows().length === 1 && sessions().length === 1, 'conversation deleted');
  rows()[0].querySelector('.ask-history-delete').click();
  await until(() => !sessions().length && doc.querySelector('.ask-history-list').textContent.includes('还没有保存的对话'), 'last conversation deleted');
  doc.querySelector('.ask-history-close').click();
  check(!doc.querySelector('.ask-turn') && doc.querySelector('#ask-content .panel-hint'), 'deleting the open conversation clears the thread');
  check(!win.runtimeErrors.length, win.runtimeErrors.join('\n'));
  document.documentElement.dataset.result = 'pass'; output.textContent = 'PASS agent chat';
} catch (error) {
  document.documentElement.dataset.result = 'fail'; output.textContent = error.stack;
}
</script>
