<!doctype html>
<meta charset="utf-8">
<title>Book context actions and immersive corner guard</title>
<pre id="result">RUNNING</pre>
<script type="module">
const output = document.getElementById('result');
const check = (value, message) => { if (!value) throw Error(message); };
const until = async predicate => {
  for (let i = 0; i < 300; i++) {
    if (predicate()) return;
    await new Promise(resolve => setTimeout(resolve, 25));
  }
  throw Error('Timed out waiting for book actions');
};
try {
  const frame = document.createElement('iframe');
  frame.style.cssText = 'width:1200px;height:800px;border:0';
  let html = await (await fetch('../dist/index.html')).text();
  frame.srcdoc = html.replace('<head>', `<head><base href="${location.origin}/dist/"><script type="module" src="/tests/native-mock.ts?menus"><\/script>`);
  document.body.append(frame);
  await until(() => frame.contentDocument?.querySelector('.book-card'));
  const doc = frame.contentDocument, win = frame.contentWindow;
  const menu = doc.getElementById('book-context-menu'), sub = doc.getElementById('book-shelf-menu');
  const card = () => doc.querySelector('.book-card');
  const click = id => doc.getElementById(id).click();
  const context = () => {
    card().dispatchEvent(new win.PointerEvent('pointerdown', { button: 2, bubbles: true }));
    card().focus();
    card().dispatchEvent(new win.MouseEvent('contextmenu', { clientX: 1140, clientY: 740, bubbles: true, cancelable: true }));
  };
  let titleFlashes = 0;
  doc.getElementById('book-title-tooltip').addEventListener('beforetoggle', event => { if (event.newState === 'open') titleFlashes++; });
  card().dispatchEvent(new win.PointerEvent('pointerdown', { button: 2, bubbles: true }));
  card().focus();
  await new Promise(resolve => setTimeout(resolve, 30));
  context();
  await new Promise(resolve => setTimeout(resolve, 450));
  check(!titleFlashes && menu.matches(':popover-open'), 'right click focus must never flash the title tooltip');
  check(menu.querySelectorAll(':scope > button').length === 7, 'all seven actions are present');
  const infoDialog = doc.getElementById('book-info-dialog');
  click('book-menu-info');
  check(!menu.matches(':popover-open') && infoDialog.open, 'view info closes the menu and opens the details dialog');
  await until(() => infoDialog.querySelector('.book-info-words'));
  check(win.nativeProbe.requests.find(request => request.method === 'book.info').params.id === 'fixture', 'details target the selected book');
  const infoText = infoDialog.textContent;
  check(infoText.includes('字数（含标点）') && infoText.includes('128,566 字') && infoText.includes('约 12.9 万') &&
    infoText.includes('字数（不含标点）') && infoText.includes('124,245 字'), 'both word counts are shown');
  check(infoText.includes('译者') && infoText.includes('测试译者') && infoText.includes('第 2 册') &&
    infoText.includes('9787536692930') && infoText.includes('2.5 MB') && infoText.includes('尚未开始'), 'calibre-style metadata rows are shown');
  check(!infoDialog.querySelector('.book-info-description b') && infoText.includes('<b>不是标签</b>'), 'description is rendered as text');
  infoDialog.querySelector('.annotation-actions .text-button').click();
  check(!infoDialog.open, 'details dialog closes');
  context();
  click('book-menu-category');
  check(sub.matches(':popover-open') && menu.matches(':popover-open'), 'nested menu keeps the parent open');
  const bounds = sub.getBoundingClientRect();
  check(bounds.left >= 8 && bounds.right <= 1192 && bounds.bottom <= 792, 'submenu flips and fits at the bottom right');
  check(sub.querySelector('[data-shelf-id="history"]').disabled, 'existing membership is marked and cannot be duplicated');
  sub.querySelector('[data-shelf-id="literature"]').click();
  await until(() => win.nativeProbe.data.shelves[0].bookIds.includes('fixture') && doc.getElementById('toast').textContent.includes('已添加至分类书架'));
  check(!menu.matches(':popover-open'), 'successful membership action dismisses menus');
  context(); click('book-menu-category');
  check(sub.querySelector('[data-shelf-id="literature"]').disabled, 'saved membership is reflected when reopening');
  click('book-menu-new-shelf');
  check(doc.getElementById('shelf-dialog').open && doc.querySelector('#shelf-books input').checked, 'new category preselects the chosen book');
  doc.getElementById('shelf-name').value = '我的珍藏';
  click('shelf-save');
  await until(() => win.nativeProbe.data.shelves.length === 3 && doc.getElementById('count-shelves').textContent === '3');
  check(win.nativeProbe.data.shelves[2].bookIds[0] === 'fixture' && doc.getElementById('count-shelves').textContent === '3', 'new shelf and membership persist with sidebar count');
  context(); click('book-menu-export');
  await until(() => win.nativeProbe.requests.some(request => request.method === 'notes.export'));
  check(win.nativeProbe.requests.find(request => request.method === 'notes.export').params.id === 'fixture', 'export targets the selected book');
  await until(() => doc.getElementById('toast').textContent.includes('笔记与对话已导出'));
  win.nativeProbe.data.exportResult = { saved: false };
  const beforeCancel = doc.getElementById('toast').textContent;
  const beforeRequests = win.nativeProbe.requests.length;
  context(); click('book-menu-export');
  await until(() => win.nativeProbe.requests.length > beforeRequests);
  await new Promise(resolve => setTimeout(resolve, 30));
  check(doc.getElementById('toast').textContent === beforeCancel, 'cancelling export is silent');
  win.nativeProbe.data.exportResult = { saved: false, empty: true };
  context(); click('book-menu-export');
  await until(() => doc.getElementById('toast').textContent.includes('还没有笔记'));
  win.nativeProbe.data.exportError = '磁盘不可写';
  context(); click('book-menu-export');
  await until(() => doc.getElementById('toast').textContent.includes('磁盘不可写'));
  win.nativeProbe.data.exportError = '';
  context(); click('book-menu-import');
  await until(() => doc.getElementById('toast').textContent.includes('已导入 2 条笔记或标注'));
  check(!menu.matches(':popover-open') && doc.getElementById('busy').hidden, 'import dismisses menus and clears busy state');
  check(win.nativeProbe.requests.find(request => request.method === 'notes.import').params.id === 'fixture', 'import targets the selected book');
  check(doc.getElementById('toast').textContent.includes('跳过 1 条已有笔记（保留本地版本）'), 'duplicate handling is explained');
  win.nativeProbe.data.notesImportResult = { imported: 0, skipped: 0, conversationsImported: 2, conversationsSkipped: 1 };
  context(); click('book-menu-import');
  await until(() => doc.getElementById('toast').textContent.includes('AI 对话导入 2 段，跳过 1 段已有对话'), 'imported conversations reported');
  win.nativeProbe.data.notesImportResult = { cancelled: true };
  const beforeImportCancel = doc.getElementById('toast').textContent;
  const beforeImportRequests = win.nativeProbe.requests.length;
  context(); click('book-menu-import');
  await until(() => win.nativeProbe.requests.length > beforeImportRequests && doc.getElementById('busy').hidden);
  check(doc.getElementById('toast').textContent === beforeImportCancel, 'cancelling import is silent');
  win.nativeProbe.data.notesImportError = '笔记不属于这本图书';
  context(); click('book-menu-import');
  await until(() => doc.getElementById('toast').textContent.includes('笔记不属于这本图书'));
  check(doc.getElementById('busy').hidden, 'failed import clears busy state');
  win.nativeProbe.data.notesImportError = '';
  // Hiding moves the book to the private shelf, which is created if the store predates it.
  context();
  check(doc.getElementById('book-menu-hide').textContent.includes('隐藏图书'), 'visible books offer hiding');
  click('book-menu-hide');
  await until(() => win.nativeProbe.data.shelves[0]?.id === 'private' && win.nativeProbe.data.shelves[0].bookIds.includes('fixture') && !doc.querySelector('.book-card'));
  check(doc.getElementById('count-all').textContent === '0' && doc.getElementById('count-unread').textContent === '0' &&
    !doc.getElementById('authors').textContent, 'hidden books leave lists, counts and the author list');
  doc.querySelector('[data-filter="shelves"]').click();
  const shelfCard = name => [...doc.querySelectorAll('#shelf-grid .shelf-card')].find(card => card.querySelector('strong')?.textContent === name);
  check(shelfCard('隐私书架').textContent.includes('1 本图书') && shelfCard('历史与人文').textContent.includes('0 本图书'),
    'only the private shelf counts hidden books');
  check(shelfCard('隐私书架').querySelector('.private-cover .material-icon svg') && !shelfCard('历史与人文').querySelector('.private-cover'),
    'the private shelf cover is the domino mask icon');
  shelfCard('历史与人文').click();
  check(!doc.querySelector('.book-card'), 'other shelves do not show hidden books');
  click('shelf-edit');
  check(![...doc.querySelectorAll('#shelf-books input')].some(input => input.value === 'fixture'), 'other shelf editors do not list hidden books');
  click('shelf-save');
  await until(() => !doc.getElementById('shelf-dialog').open);
  check(win.nativeProbe.data.shelves.find(shelf => shelf.id === 'history').bookIds.includes('fixture'), 'editing another shelf keeps hidden memberships');
  click('shelves-back');
  shelfCard('隐私书架').click();
  check(doc.querySelector('.book-card'), 'the private shelf shows hidden books');
  click('shelf-edit');
  check(doc.getElementById('shelf-name').readOnly, 'the private shelf cannot be renamed');
  doc.getElementById('shelf-dialog').close();
  context();
  check(doc.getElementById('book-menu-hide').textContent.includes('取消隐藏'), 'hidden books offer unhiding');
  click('book-menu-hide');
  await until(() => !win.nativeProbe.data.shelves[0].bookIds.includes('fixture') && !doc.querySelector('.book-card'));
  doc.querySelector('[data-filter="all"]').click();
  await until(() => doc.querySelector('.book-card') && doc.getElementById('count-all').textContent === '1');
  context();
  doc.getElementById('book-menu-category').focus();
  doc.getElementById('book-menu-category').dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true, cancelable: true }));
  check(sub.contains(doc.activeElement), 'keyboard opens the nested menu');
  doc.activeElement.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
  check(!sub.matches(':popover-open') && menu.matches(':popover-open') && doc.activeElement.id === 'book-menu-category', 'Escape closes only the submenu and restores focus');
  click('book-menu-open');
  await until(() => !doc.getElementById('reader-view').hidden && doc.getElementById('reader-loading').hidden);
  const infoButton = doc.getElementById('reader-book-info');
  check(infoButton.querySelector('.fluent-icon')?.textContent === String.fromCharCode(0xe946), 'reader toolbar uses the Segoe Fluent info glyph');
  const infoRequests = win.nativeProbe.requests.filter(request => request.method === 'book.info').length;
  infoButton.click();
  await until(() => infoDialog.open && win.nativeProbe.requests.filter(request => request.method === 'book.info').length > infoRequests && infoDialog.querySelector('.book-info-words'));
  infoDialog.querySelector('.annotation-header .icon-button').click();
  check(!infoDialog.open, 'reader details dialog closes from the header');
  click('collapse-toolbar');
  await until(() => doc.getElementById('reader-view').dataset.toolbar === 'false');
  const edge = doc.getElementById('toc-reveal-zone').getBoundingClientRect();
  const back = doc.getElementById('corner-library').getBoundingClientRect();
  const workspace = doc.querySelector('.reader-workspace').getBoundingClientRect();
  const panelStyle = win.getComputedStyle(doc.getElementById('toc-panel'));
  check(Math.abs(edge.top - workspace.top) < 1 && Math.abs(edge.bottom - workspace.bottom) < 1,
    'the reveal zone keeps its original full height');
  check(panelStyle.top === '12px' && panelStyle.bottom === '12px', 'the sidebar keeps its original insets and height');
  check(!win.runtimeErrors.length, win.runtimeErrors.join('\n'));
  document.documentElement.dataset.result = 'pass'; output.textContent = 'PASS context actions and corner guard';
} catch (error) {
  document.documentElement.dataset.result = 'fail'; output.textContent = error.stack;
}
</script>
