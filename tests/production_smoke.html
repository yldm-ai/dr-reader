<!doctype html>
<meta charset="utf-8">
<title>Bundled application smoke test</title>
<pre id="result">RUNNING</pre>
<script type="module">
const output = document.getElementById('result');
const check = (value, label) => { if (!value) throw Error(label); };
const until = async predicate => {
  for (let i = 0; i < 300; i++) {
    if (predicate()) return;
    await new Promise(resolve => setTimeout(resolve, 30));
  }
  throw Error('Timed out waiting for bundled application');
};
try {
  const frame = document.createElement('iframe');
  frame.style.cssText = 'width:1200px;height:800px;border:0';
  let html = await (await fetch('../dist/index.html')).text();
  // The library starts as placeholder cards (no loading overlay) until bootstrap renders it.
  const shipped = new DOMParser().parseFromString(html, 'text/html');
  check(shipped.body.classList.contains('booting') && shipped.querySelectorAll('#book-grid .book-skeleton').length >= 8 &&
    shipped.getElementById('busy').hidden, 'startup must show placeholder cards instead of a loading overlay');
  html = html.replace('<head>', `<head><base href="${location.origin}/dist/"><script type="module" src="/tests/native-mock.ts"><\/script>`);
  frame.srcdoc = html;
  document.body.append(frame);
  await until(() => frame.contentDocument.querySelector('.book-card'));
  const doc = frame.contentDocument;
  const win = frame.contentWindow;
  check(doc.querySelectorAll('.material-icon svg path').length > 20 && doc.querySelectorAll('.fluent-icon').length >= 2, 'bundled icons did not hydrate');
  check(!doc.querySelector('.book-skeleton') && !doc.body.classList.contains('booting') &&
    win.getComputedStyle(doc.getElementById('count-all')).visibility === 'visible', 'loaded library must replace the placeholders and show counts');
  {
    // Placeholders share the real card's geometry, so nothing shifts when the books arrive.
    const probe = doc.importNode(shipped.querySelector('.book-skeleton'), true);
    doc.getElementById('book-grid').prepend(probe);
    const real = doc.querySelector('.book-card .cover-wrap').getBoundingClientRect();
    const fake = probe.querySelector('.skeleton-cover').getBoundingClientRect();
    probe.remove();
    check(Math.abs(fake.height - real.height) < 1 && Math.abs(fake.width - real.width) < 1,
      `placeholder covers must match real covers (${fake.width}x${fake.height} vs ${real.width}x${real.height})`);
  }
  doc.querySelector('.book-card').click();
  await until(() => !doc.getElementById('reader-view').hidden && doc.getElementById('reader-loading').hidden);
  const content = doc.getElementById('book-frame').contentDocument;
  check(content.body.textContent.includes('原创的阅读测试文字'), 'bundled reader failed to load chapter');
  check(doc.getElementById('page-indicator').textContent.includes('/'), 'bundled pagination did not initialize');
  doc.getElementById('reader-settings').click();
  doc.getElementById('setting-fontFamily-trigger').click();
  check(doc.querySelector('.select-popup:popover-open'), 'bundled font picker failed to open');
  const input = doc.querySelector('.select-popup:popover-open input');
  input.value = 'yahei'; input.dispatchEvent(new win.Event('input'));
  input.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
  await until(() => win.nativeProbe.data.settings.reading.fontFamily === 'Microsoft YaHei');
  doc.getElementById('reading-settings').close();
  doc.getElementById('back-library').click();
  await until(() => doc.getElementById('reader-view').hidden);
  check(doc.getElementById('book-frame').srcdoc === '', 'closing a book must release the chapter document');
  doc.querySelector('.book-card').click();
  await until(() => !doc.getElementById('reader-view').hidden && doc.getElementById('reader-loading').hidden);
  check(win.chapterRequests === 1, 'reopening an immutable cached chapter must avoid another fetch');
  doc.getElementById('reader-app-settings').click();
  const animations = doc.getElementById('app-animations');
  const openingSwitch = doc.getElementById('app-book-opening-enabled');
  openingSwitch.checked = true; openingSwitch.dispatchEvent(new win.Event('change'));
  await until(() => win.nativeProbe.data.settings.application.bookOpeningEnabled === true);
  check(win.nativeProbe.data.settings.application.animations === false,
    'opening animation must work independently of disabled interface animations');
  const openingChoice = doc.getElementById('app-book-opening');
  openingChoice.value = 'book'; openingChoice.dispatchEvent(new win.Event('change'));
  await until(() => win.nativeProbe.data.settings.application.bookOpeningAnimation === 'book');
  doc.getElementById('application-settings').close();
  doc.getElementById('back-library').click();
  await until(() => doc.getElementById('reader-view').hidden);
  doc.querySelector('.book-card').click();
  check(doc.querySelector('.book-opening'), 'opening a book with animations enabled must start the circles immediately');
  check(doc.querySelector('.book-opening-book'), 'the selected book effect must start immediately in the production bundle');
  await until(() => doc.getElementById('busy').hidden);
  check(!doc.querySelector('.book-opening') && !doc.getElementById('reader-view').hidden,
    'opening must collapse and release its overlay when the chapter is ready');
  check(content.querySelector('#dr-loading-paper'), 'the first chapter must receive its reading paper before layout');
  doc.getElementById('reader-app-settings').click();
  openingChoice.value = 'cover'; openingChoice.dispatchEvent(new win.Event('change'));
  await until(() => win.nativeProbe.data.settings.application.bookOpeningAnimation === 'cover');
  doc.getElementById('application-settings').close();
  doc.getElementById('back-library').click();
  await until(() => doc.getElementById('reader-view').hidden);
  doc.querySelector('.book-card').click();
  check(doc.querySelector('.book-opening-cover strong').textContent === '阅读与时光',
    'the selected cover animation must use the current book title when its image is missing');
  await until(() => doc.getElementById('busy').hidden);
  check(!doc.querySelector('.book-opening') && !doc.getElementById('reader-view').hidden,
    'cover opening must release its overlay and reveal the reader');
  doc.getElementById('reader-app-settings').click();
  animations.checked = false; animations.dispatchEvent(new win.Event('change'));
  openingSwitch.checked = false; openingSwitch.dispatchEvent(new win.Event('change'));
  await until(() => win.nativeProbe.data.settings.application.animations === false);
  await until(() => win.nativeProbe.data.settings.application.bookOpeningEnabled === false);
  doc.getElementById('application-settings').close();
  doc.getElementById('reader-settings').click();
  check(!win.runtimeErrors.length, `Runtime errors: ${win.runtimeErrors.join('; ')}`);
  output.textContent = 'PASS: production bundle bootstrap, Fluent icons, book open/reopen/cache, pagination, font selection and persistence';
  document.documentElement.dataset.result = 'pass';
} catch (error) {
  output.textContent = 'FAIL\n' + error.stack;
  document.documentElement.dataset.result = 'fail';
}
</script>
