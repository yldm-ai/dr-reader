<!doctype html>
<meta charset="utf-8">
<title>Reader interaction regression</title>
<link rel="stylesheet" href="../web/styles.css">
<pre id="result">RUNNING</pre>
<script type="module">
const output = document.getElementById('result');
const watchdog = setTimeout(() => { output.textContent = 'FAIL: interaction timed out'; document.documentElement.dataset.result = 'fail'; }, 8000);
const messages = new EventTarget();
const requests = [];
const stored = new Map();
window.chrome ||= {};
window.chrome.webview = {
  addEventListener: (...args) => messages.addEventListener(...args),
  postMessage({ id, method, params }) {
    requests.push({ method, params });
    if (method === 'annotation.delete') stored.delete(params.annotationId);
    if (method === 'annotation.save') stored.set(params.annotation.id, params.annotation);
    const result = method === 'annotation.save' ? params.annotation : true;
    queueMicrotask(() => messages.dispatchEvent(new MessageEvent('message', { data: { id, result } })));
  },
};
function check(condition, message) { if (!condition) throw Error(message); }
try {
  // Use the production menu markup, but keep all bridge data in this test page.
  const html = new DOMParser().parseFromString(await (await fetch('../web/index.html')).text(), 'text/html');
  document.body.append(...html.body.children);
  const { Reader } = await import('../web/reader.ts');
  const reader = Object.create(Reader.prototype);
  let refreshed = 0;
  Object.assign(reader, {
    book: { id: 'test-book', chapters: [{ href: 'c.html', title: '' }] }, chapter: 0, doc: document, annotations: [],
    appSettings: { selectionActions: {}, dictionaries: [] },
    refreshAnnotations() { refreshed++; }, notes() {},
  });
  const text = document.createElement('p');
  text.textContent = '这是原创的下划线交互测试。';
  document.body.append(text);
  const range = document.createRange();
  range.selectNodeContents(text);
  reader.annotationLayer = { ranges: new Map([['underline-test', range]]), rect: value => value.getBoundingClientRect() };
  const annotation = { id: 'underline-test', style: 'underline', note: '', color: '#ddebf1', start: 0, end: 13, quote: text.textContent };
  stored.set(annotation.id, annotation);
  reader.annotations = [annotation];
  // Reselecting precisely the existing underline presses its button; there is no separate delete.
  reader.showSelectionMenu(range);
  const pressed = id => document.getElementById(id).getAttribute('aria-pressed') === 'true';
  check(!document.getElementById('selection-delete'), 'the mark delete button is gone');
  check(pressed('selection-underline') && !pressed('selection-highlight'), 'underline state is missing');
  check(document.getElementById('selection-note-delete').hidden, 'a passage without a note offers no note deletion');
  const toast = document.getElementById('toast');
  toast.hidden = true;
  // Pressing the pressed underline removes it.
  await reader.toggleMark('underline');
  check(!stored.has(annotation.id) && !reader.annotations.length && refreshed === 1,
    'unpressing must remove persisted data and refresh visible annotations');
  check(requests[0].params.annotationId === annotation.id, 'removal targeted the wrong annotation');
  check(toast.hidden, 'removing an underline from the selection menu must be silent');

  // Removing the highlight of a noted passage keeps the note; deleting the note then removes it.
  const noted = { ...annotation, id: 'noted', style: 'highlight', note: '原创笔记' };
  stored.set(noted.id, noted);
  reader.annotations = [noted];
  reader.annotationLayer.ranges = new Map([['noted', range]]);
  reader.showSelectionMenu(range);
  check(pressed('selection-highlight') && !document.getElementById('selection-note-delete').hidden &&
    document.getElementById('selection-note-label').textContent === '编辑笔记', 'noted highlight menu state');
  await reader.toggleMark('highlight');
  check(stored.get('noted')?.style === 'note' && stored.get('noted').note === '原创笔记', 'the note must survive unmarking');
  reader.showSelectionMenu(range);
  check(!pressed('selection-highlight') && !pressed('selection-underline'), 'a note-only passage has no pressed mark');
  await reader.deleteNote();
  check(!stored.has('noted') && !reader.annotations.length && !toast.hidden, 'deleting the only note removes the passage');
  toast.hidden = true;
  reader.annotationLayer.ranges = new Map([['underline-test', range]]);
  stored.set(annotation.id, annotation);
  reader.annotations = [annotation];
  reader.editingAnnotation = annotation;
  document.getElementById('annotation-dialog').showModal();
  await reader.deleteFromDialog();
  check(toast.hidden && !stored.has(annotation.id) && !document.getElementById('annotation-dialog').open,
    'deleting an underline from the note dialog must be silent and close the dialog');
  reader.showSelectionMenu(range);
  check(!pressed('selection-highlight') && !pressed('selection-underline') &&
    document.getElementById('selection-note-delete').hidden, 'unmarked text has no pressed marks');

  toast.hidden = true;
  const saveProbe = Object.create(reader);
  let savedStyle;
  saveProbe.selectionAnchor = () => ({ text: text.textContent });
  saveProbe.saveAnnotation = async value => { savedStyle = value.style; };
  await saveProbe.saveSelection('yellow', 'underline');
  check(savedStyle === 'underline' && toast.hidden, 'saving an underline must not show a success toast');
  await saveProbe.saveSelection('yellow', 'highlight');
  check(savedStyle === 'highlight' && !toast.hidden, 'highlight feedback must remain available');

  // The note dialog picks its mark from a visible segmented control and previews it on the quote.
  const editing = { ...annotation, id: 'dialog-style', style: 'underline', note: '旧笔记' };
  saveProbe.annotations = [editing];
  saveProbe.selection = { annotationId: editing.id, text: editing.quote };
  saveProbe.renderHighlightPalette();
  saveProbe.openAnnotationDialog();
  const quote = document.getElementById('annotation-quote');
  check(document.querySelector('[name=annotation-style][value=underline]').checked && quote.dataset.style === 'underline' &&
    quote.textContent === editing.quote, 'the dialog must reflect the edited mark');
  const noteOnly = document.querySelector('[name=annotation-style][value=note]');
  noteOnly.click();
  // The constructor normally wires this change handler; the probe skips the constructor.
  saveProbe.syncDialogColors();
  check(quote.dataset.style === 'note' && document.querySelector('#annotation-swatches button').disabled,
    'a note without a mark disables the colours');
  let savedNote;
  saveProbe.saveAnnotation = async value => { savedNote = value; };
  await saveProbe.saveFromDialog();
  check(savedNote.style === 'note' && savedNote.note === '旧笔记' && !document.getElementById('annotation-dialog').open,
    'the chosen segmented style must be saved');

  // A click that brings the app back to the foreground acts like any other but turns no page;
  // the next one taps.
  const press = () => ({ button: 0, isPrimary: true, target: document.body, clientX: 300, clientY: 200, preventDefault() {} });
  const realHasFocus = document.hasFocus;
  reader.trackActivation(window);
  document.hasFocus = () => true;
  window.dispatchEvent(new Event('blur'));
  await new Promise(resolve => setTimeout(resolve, 10));
  reader.beginPageTap(press());
  check(reader.tapStart && !reader.tapDismissed, 'focus moving into a chapter frame is not a deactivation');
  document.hasFocus = () => false;
  window.dispatchEvent(new Event('blur'));
  await new Promise(resolve => setTimeout(resolve, 10));
  document.hasFocus = realHasFocus;
  window.dispatchEvent(new Event('focus'));
  reader.beginPageTap(press());
  check(!reader.tapStart, 'the activating press must not start a page tap');
  check(!reader.tapDismissed && !reader.consumeDismissedTap(new MouseEvent('click')),
    'the activating click must still reach links, notes and selection');
  reader.beginPageTap(press());
  check(reader.tapStart && !reader.tapDismissed, 'the press after activation must tap normally');
  // Coming back with a click on the toolbar uses up the activation; the next page tap turns.
  document.hasFocus = () => false;
  window.dispatchEvent(new Event('blur'));
  await new Promise(resolve => setTimeout(resolve, 10));
  document.hasFocus = realHasFocus;
  window.dispatchEvent(new Event('focus'));
  document.body.dispatchEvent(new PointerEvent('pointerdown', { button: 0, bubbles: true }));
  await new Promise(resolve => setTimeout(resolve, 450));
  reader.beginPageTap(press());
  check(reader.tapStart, 'an activating press outside the page must not swallow the next page tap');

  // “查词典” follows its setting and hands the selected text to DR Dict's popup through the host.
  reader.appSettings = { selectionActions: { drDict: false }, dictionaries: [] };
  reader.showSelectionMenu(range);
  check(document.getElementById('selection-dr-dict').hidden, 'the DR Dict action must follow its setting');
  reader.appSettings = { selectionActions: { drDict: true }, dictionaries: [] };
  reader.showSelectionMenu(range);
  check(!document.getElementById('selection-dr-dict').hidden, 'the DR Dict action must show when enabled');
  reader.selection = { text: '  原创词条 \n' };
  requests.length = 0;
  await reader.lookupInDrDict();
  check(requests.length === 1 && requests[0].method === 'dict.popup' && requests[0].params.text === '原创词条',
    'the DR Dict action must send the trimmed selection');
  check(!('rect' in requests[0].params), 'without a selection box DR Dict falls back to the pointer');
  check(document.getElementById('selection-menu').hidden, 'the selection menu closes when DR Dict opens');
  // With the selection's box the popup is placed right below the text: the box is the selected
  // line in the top-level viewport.
  text.scrollIntoView({ block: 'center' });
  reader.showSelectionMenu(range);
  requests.length = 0;
  await reader.lookupInDrDict();
  const sent = requests[0]?.params;
  const lines = [...range.getClientRects()].filter(r => r.width && r.height);
  const frameBox = { top: 0, left: 0 };
  const lastLine = lines[lines.length - 1];
  check(sent?.rect && sent.scale === devicePixelRatio &&
    Math.abs(sent.rect.bottom - (frameBox.top + lastLine.bottom)) < 1 &&
    Math.abs(sent.rect.top - (frameBox.top + lines[0].top)) < 1 &&
    sent.rect.left >= frameBox.left && sent.rect.left <= frameBox.left + lastLine.right,
    'the DR Dict action must send the selection box in top-level viewport pixels');
  {
    // Book text renders in an iframe: the box shifts by the frame's offset, and a selection paged
    // out of the frame's view has no box (DR Dict then opens at the pointer).
    const { selectionLineRect } = await import('../web/reader.ts');
    const frame = document.createElement('iframe');
    frame.style.cssText = 'position:fixed;left:40px;top:60px;width:300px;height:200px;border:0';
    frame.srcdoc = '<p style="margin:10px;font:16px/24px sans-serif">词语<span id="w">选中</span>其后</p>' +
      '<p id="far" style="position:absolute;top:900px">远处</p>';
    await new Promise(resolve => { frame.onload = resolve; document.body.append(frame); });
    const inner = frame.contentDocument.createRange();
    inner.selectNodeContents(frame.contentDocument.getElementById('w'));
    const word = inner.getBoundingClientRect();
    const box = selectionLineRect(inner);
    check(box && Math.abs(box.left - (40 + word.left)) < 1 && Math.abs(box.bottom - (60 + word.bottom)) < 1 &&
      Math.abs(box.top - (60 + word.top)) < 1, 'the selection box must be offset by the book frame');
    inner.selectNodeContents(frame.contentDocument.getElementById('far'));
    check(selectionLineRect(inner) === null, 'a selection out of view must fall back to the pointer');
    frame.remove();
  }
  reader.appSettings = { selectionActions: {}, dictionaries: [] };

  const dictionaries = [{ id: 'one', name: '测试词典一' }, { id: 'two', name: '测试词典二' }];
  let pending = reader.chooseDictionary(dictionaries);
  let dialog = document.querySelector('.dictionary-picker');
  check(dialog.open, 'dictionary chooser did not open');
  check(!dialog.textContent.includes('LOOK UP'), 'dictionary chooser must not show the English heading');
  check(dialog.getBoundingClientRect().width <= 320, 'dictionary chooser must use the compact layout');
  dialog.querySelector('[aria-label="关闭查词窗口"]').click();
  check(await pending === null && !dialog.isConnected, 'close button must cancel and remove the chooser');
  pending = reader.chooseDictionary(dictionaries);
  dialog = document.querySelector('.dictionary-picker');
  const rect = dialog.getBoundingClientRect();
  dialog.dispatchEvent(new PointerEvent('pointerdown', { clientX: rect.left + 5, clientY: rect.top + 5 }));
  dialog.dispatchEvent(new MouseEvent('click', { clientX: rect.left + 5, clientY: rect.top + 5 }));
  check(dialog.open, 'blank space inside the chooser must not dismiss it');
  dialog.dispatchEvent(new PointerEvent('pointerdown', { clientX: -1, clientY: -1 }));
  dialog.dispatchEvent(new MouseEvent('click', { clientX: -1, clientY: -1 }));
  check(await pending === null && !dialog.isConnected, 'backdrop click must dismiss the chooser');
  pending = reader.chooseDictionary(dictionaries);
  dialog = document.querySelector('.dictionary-picker');
  dialog.dispatchEvent(new Event('cancel', { cancelable: true }));
  check(await pending === null, 'Escape/cancel must dismiss the chooser');
  pending = reader.chooseDictionary(dictionaries);
  dialog = document.querySelector('.dictionary-picker');
  dialog.querySelectorAll('.dictionary-choice')[1].click();
  check((await pending).id === 'two', 'dictionary selection must still work');

  reader.attachTocHover();
  const panel = document.getElementById('toc-panel');
  panel.dispatchEvent(new Event('scroll'));
  check(panel.dataset.scrolling === 'true', 'scroll must suppress stale hover');
  panel.dispatchEvent(new PointerEvent('pointermove'));
  check(panel.dataset.scrolling === 'true', 'layout-only pointer events must not reenable hover');
  panel.dispatchEvent(new PointerEvent('pointermove', { movementY: 2 }));
  check(!panel.hasAttribute('data-scrolling'), 'real pointer movement must restore hover');
  output.textContent = 'PASS: pressed marks toggle off, notes survive unmarking, silent save, compact chooser close/backdrop/Escape/selection, scroll hover';
  document.documentElement.dataset.result = 'pass';
} catch (error) {
  output.textContent = 'FAIL\n' + error.stack;
  document.documentElement.dataset.result = 'fail';
}
clearTimeout(watchdog);
</script>
