<!doctype html>
<meta charset="utf-8">
<title>Reader motion regression</title>
<link rel="stylesheet" href="../web/styles.css">
<pre id="result">RUNNING</pre>
<div id="app"></div>
<div id="toast" hidden></div>
<div id="page-surface" class="page-surface" style="width:600px;height:360px;--reading-paper:#fffaf3">
  <iframe id="book-frame" sandbox="allow-same-origin"></iframe>
</div>
<script type="module">
import { ReaderMotion } from '../web/motion.ts';
const output = document.getElementById('result');
const host = document.getElementById('page-surface'), frame = document.getElementById('book-frame');
const check = (value, message) => { if (!value) throw Error(message); };
const until = async predicate => {
  for (let i = 0; i < 150; i++) { if (predicate()) return; await new Promise(resolve => setTimeout(resolve, 10)); }
  throw Error('Motion did not reach the expected state');
};
const load = html => new Promise(resolve => { frame.onload = resolve; frame.srcdoc = html; });
const original = `<style>html{overflow:hidden}body{margin:0;display:flex;width:1200px;height:360px;background:#fffaf3;color:#37352f;font:20px/1.8 'Microsoft YaHei'}section{flex:0 0 600px;box-sizing:border-box;padding:35px}section+section{background:#e8f0f7}h1{font-size:30px}::highlight(test-mark){background:#e8bd6f}</style><section><h1>第一页</h1><p>这是一张正在移出的旧书页。</p><p>平移动画应当完整移动一页的距离。</p></section><section><h1>第二页</h1><p>这是一张从右侧移入的新书页。</p><p>旧页与新页应同时出现。</p></section>`;
try {
  await load(original);
  const motion = new ReaderMotion();
  const source = frame.contentDocument;
  const range = source.createRange(); range.selectNodeContents(source.querySelector('p').firstChild);
  source.defaultView.CSS.highlights.set('test-mark', new source.defaultView.Highlight(range));
  let updates = 0;
  let pending = motion.change(host, 'slide', 600, 1, () => { updates++; source.defaultView.scrollTo(600, 0); }, true);
  await until(() => host.querySelector('.page-motion')?.getAnimations({ subtree: true }).length === 2);
  let overlay = host.querySelector('.page-motion');
  let animations = overlay.getAnimations({ subtree: true });
  animations.forEach(animation => { animation.pause(); animation.currentTime = 300; });
  const pages = overlay.querySelectorAll('.motion-page');
  check(pages.length === 2 && pages[0].querySelector('iframe').contentWindow.scrollX === 0 &&
    pages[1].querySelector('iframe').contentWindow.scrollX === 600, 'motion snapshots must show different page offsets');
  check(getComputedStyle(pages[0]).opacity === '1' && getComputedStyle(pages[1]).opacity === '1', 'slide must not fade text');
  check(animations[0].effect.getKeyframes().at(-1).transform === 'translateX(-100%)', 'outgoing page must travel a full page');
  check(animations[1].effect.getKeyframes()[0].transform === 'translateX(100%)', 'incoming page must start one full page away');
  check(pages[0].querySelector('iframe').contentWindow.CSS.highlights.get('test-mark')?.size === 1, 'snapshot must preserve highlights');
  await window.captureMotion?.('slide-forward');
  animations.forEach(animation => animation.finish()); await pending;
  check(updates === 1 && !host.querySelector('.page-motion') && frame.style.visibility === '', 'slide must commit once and clean up');
  // Every viewport remains a single page, including wide landscape-shaped windows.
  for (const width of [600, 980]) {
    host.style.width = `${width}px`;
    // The reader picks the soft-page corner from the pointer and passes it in.
    for (const [effect, corner] of [['turn', 'top'], ['turn', 'bottom'], ['turn-hard', 'top']]) {
      for (const direction of [1, -1]) {
        const dark = effect === 'turn-hard';
        const paper = dark ? '#191919' : '#fffaf3';
        host.style.setProperty('--reading-paper', paper);
        const html = `<style>html{overflow:hidden}body{margin:0;display:flex;width:${width * 2}px;height:360px;background:${paper};color:${dark ? '#cfcfcd' : '#37352f'};font:20px/1.8 'Microsoft YaHei'}section{flex:0 0 ${width}px;box-sizing:border-box;padding:35px}</style><section><h1>第一页</h1><p>原文与标注随单张纸页翻动。</p></section><section><h1>第二页</h1><p>单页阅读不显示左右双页。</p></section>`;
        await load(html);
        const doc = frame.contentDocument;
        if (direction < 0) doc.defaultView.scrollTo(width, 0);
        const mark = doc.createRange(); mark.selectNodeContents(doc.querySelector('p').firstChild);
        doc.defaultView.CSS.highlights.set('test-mark', new doc.defaultView.Highlight(mark));
        const next = direction > 0 ? width : 0;
        pending = motion.change(host, effect, 600, direction, () => doc.defaultView.scrollTo(next, 0), false, corner);
        await until(() => host.querySelector('.stpageflip-host')?.dataset.state === 'flipping');
        const engine = host.querySelector('.stpageflip-host');
        check(engine.dataset.orientation === 'portrait', `${width}: StPageFlip must stay in single-page mode`);
        check(getComputedStyle(engine).transform === 'none' &&
          [...engine.querySelectorAll('[class*="Shadow"]')].every(item => !item.style.transform.includes('3d')),
          'StPageFlip root and shadows must stay 2D so snapshot text keeps ClearType');
        check(engine.dataset.density === (effect === 'turn-hard' ? 'hard' : 'soft'), 'wrong page material');
        // The turn plays on the compositor: keyframes of transform, clip-path and opacity only.
        const playing = engine.getAnimations({ subtree: true });
        const animated = new Set(playing.flatMap(animation => animation.effect.getKeyframes()
          .flatMap(keyframe => Object.keys(keyframe).filter(key => !['offset', 'easing', 'composite', 'computedOffset'].includes(key)))));
        check(playing.length >= 2 && [...animated].every(key => ['transform', 'clipPath', 'opacity'].includes(key)),
          `${effect} ${corner} ${direction}: the turn must play as compositor animations (${playing.length}: ${[...animated]})`);
        check(engine.dataset.corner === corner, 'wrong curl corner');
        // Soft pages curl forward, or uncurl the previous page backward, with a flap copy.
        const copied = effect !== 'turn-hard';
        check(engine.dataset.pageCount === (copied ? '3' : '2'), 'unexpected page count');
        const snapshots = [...engine.querySelectorAll('iframe')];
        check(snapshots.length === (copied ? 3 : 2), 'unexpected temporary document count');
        check(snapshots.every(item => item.contentWindow.innerWidth === width &&
          item.contentDocument.body.textContent.includes('第一页')), `snapshot width or real text changed: ${JSON.stringify({
            width, pageCount: engine.dataset.pageCount, snapshots: snapshots.map(item => ({
              width: item.contentWindow.innerWidth,
              scrollX: item.contentWindow.scrollX,
              text: item.contentDocument.body.textContent.slice(0, 40),
            })),
          })}`);
        check(snapshots[0].contentWindow.scrollX === 0 && snapshots[1].contentWindow.scrollX === width,
          `page reparenting must preserve each snapshot column offset: ${JSON.stringify(
            snapshots.map(item => item.contentWindow.scrollX))}`);
        check(snapshots[0].contentWindow.CSS.highlights.get('test-mark')?.size === 1,
          'page-flip snapshots must preserve text highlights');
        const rect = engine.getBoundingClientRect();
        check(Math.abs(rect.width - width) < 1, 'single-page engine must fill one reading viewport');
        if (width === 600) {
          await new Promise(resolve => setTimeout(resolve, 170));
          await window.captureMotion?.(`${effect}-${corner}-${direction > 0 ? 'forward' : 'backward'}`);
        }
        await pending;
        check(!host.querySelector('.page-motion') && frame.style.visibility === '' &&
          frame.contentWindow.scrollX === next, 'completed turn must restore the live selectable document');
      }
    }
  }
  // A landed turn fades into the live page (shown underneath) instead of swapping in one frame.
  host.style.width = '600px';
  await load(original);
  pending = motion.change(host, 'turn', 400, 1, () => frame.contentWindow.scrollTo(600, 0));
  await until(() => host.querySelector('.page-motion')?.getAnimations().some(animation =>
    animation.effect.getKeyframes().some(keyframe => keyframe.opacity === '0')));
  check(frame.style.visibility === '' && host.querySelector('.stpageflip-host')?.dataset.state === 'read',
    'the live page must be visible under the fading landed sheet');
  await pending;
  check(!host.querySelector('.page-motion') && frame.contentWindow.scrollX === 600, 'the landing fade must end on the live page');
  // A backward single page is a forward flip replayed in reverse; when it lands the library would
  // redraw the page being left. The engine stops at the landing pose, so the fade shows the
  // returned sheet (on top) and never the old page.
  pending = motion.change(host, 'turn', 400, -1, () => frame.contentWindow.scrollTo(0, 0));
  await until(() => host.querySelector('.page-motion')?.getAnimations().some(animation =>
    animation.effect.getKeyframes().some(keyframe => keyframe.opacity === '0')));
  const landedSheet = [...host.querySelectorAll('.stpageflip-host .stf__item')].find(item => item.style.zIndex === '5');
  const landedPose = landedSheet?.style.cssText;
  await new Promise(resolve => setTimeout(resolve, 60));
  check(landedSheet && getComputedStyle(landedSheet).display !== 'none' && landedSheet.style.cssText === landedPose,
    'a backward turn must keep its landing pose through the fade instead of redrawing the page it left');
  // The page being left (engine page 1) must be gone: hidden, or clipped to nothing as the
  // returned sheet lands. Its starting pose showed it whole, and so did the library's resting state.
  const leftPage = host.querySelectorAll('.stpageflip-host .stf__item')[1];
  const clip = getComputedStyle(leftPage).clipPath;
  const points = [...clip.matchAll(/(-?[\d.]+)px (-?[\d.]+)px/g)].map(match => [Number(match[1]), Number(match[2])]);
  const area = Math.abs(points.reduce((sum, [x, y], i) => { const [nx, ny] = points[(i + 1) % points.length]; return sum + x * ny - nx * y; }, 0)) / 2;
  check(getComputedStyle(leftPage).display === 'none' || (points.length > 2 && area < 600 * 360 * .02),
    `a backward turn must not show the page it left once it lands (clip ${clip})`);
  await pending;
  check(frame.contentWindow.scrollX === 0, 'the backward landing fade must end on the live previous page');
  // A cancelled library turn must tear down its renderer and show the committed live page.
  pending = motion.change(host, 'turn', 600, 1, () => frame.contentWindow.scrollTo(980, 0));
  await until(() => host.querySelector('.stpageflip-host')?.dataset.state === 'flipping');
  motion.cancel(); await pending;
  check(!host.querySelector('.page-motion') && frame.style.visibility === '', 'cancelled StPageFlip must release its overlay');
  // A new chapter is rendered before the old page is removed, using the same engine.
  pending = motion.change(host, 'turn', 600, 1, () => load(original.replace('第一页', '下一章')), true, 'bottom');
  await until(() => host.querySelector('.stpageflip-host')?.dataset.state === 'flipping');
  check(host.querySelector('.stpageflip-host').dataset.corner === 'bottom', 'cross-chapter turn must keep the pointer corner');
  check([...host.querySelectorAll('.stpageflip-host iframe')].some(item => item.contentDocument.body.textContent.includes('下一章')),
    'cross-chapter page-flip must wait for the new chapter');
  await pending;
  // In-chapter slides and covers run on resident copies: they start at once, and a turn during a
  // turn continues every page from where it is instead of waiting or jumping.
  host.style.width = '600px';
  await load(original);
  for (const mode of ['slide', 'cover']) {
    frame.contentWindow.scrollTo(0, 0);
    motion.prepare(host, mode, `chapter-${mode}`);
    await until(() => motion.strip.ready(`chapter-${mode}`));
    const started = performance.now();
    await motion.change(host, mode, 600, 1, () => frame.contentWindow.scrollTo(600, 0));
    check(performance.now() - started < 50, `${mode}: a resident turn must start without loading snapshots`);
    const panes = [...host.querySelectorAll('.motion-strip .motion-page.visible')];
    check(panes.length === 2 && frame.style.visibility === 'hidden', `${mode}: old and new pages must both be on the strip`);
    const offsets = panes.map(pane => pane.querySelector('iframe').contentWindow.scrollX).sort((a, b) => a - b).join();
    check(offsets === '0,600', `${mode}: strip pages must show the old and the new page: ${offsets}`);
    await new Promise(resolve => setTimeout(resolve, 150));
    const position = () => panes.map(pane => new DOMMatrixReadOnly(getComputedStyle(pane).transform).m41);
    const before = position();
    await motion.change(host, mode, 600, -1, () => frame.contentWindow.scrollTo(0, 0));
    const after = position();
    check(before.every((x, i) => Math.abs(after[i] - x) < 40),
      `${mode}: an interrupting turn must continue from the current positions: ${before} -> ${after}`);
    check(host.querySelectorAll('.motion-strip .motion-page.visible').length === 2, `${mode}: turning back reuses the leaving page`);
    await until(() => !host.querySelector('.motion-strip.active'));
    check(frame.style.visibility === '' && frame.contentWindow.scrollX === 0, `${mode}: the settled turn must show the live page`);
  }
  // A turn immediately after a new layout must not fall back to a blocking snapshot animation.
  await load(original);
  frame.contentWindow.scrollTo(0, 0);
  motion.prepare(host, 'cover', 'cold-cover');
  await motion.change(host, 'cover', 1200, 1, () => frame.contentWindow.scrollTo(600, 0));
  check(host.querySelector('.motion-strip.active'), 'cold cover must use the interruptible strip');
  check(!host.querySelector('.page-motion'), 'cold cover must not use a blocking snapshot');
  await new Promise(resolve => setTimeout(resolve, 80));
  const leaving = [...host.querySelectorAll('.motion-strip .motion-page.visible')]
    .find(pane => pane.querySelector('iframe').contentWindow.scrollX === 0);
  const beforeReverse = new DOMMatrixReadOnly(getComputedStyle(leaving).transform).m41;
  await motion.change(host, 'cover', 1200, -1, () => frame.contentWindow.scrollTo(0, 0));
  const afterReverse = new DOMMatrixReadOnly(getComputedStyle(leaving).transform).m41;
  check(Math.abs(beforeReverse - afterReverse) < 40, 'cold cover must reverse from its current position');
  motion.cancel();
  motion.prepare(host, 'cover', 'cancel-cold-cover');
  let cancelledUpdates = 0;
  const cancelledCover = motion.change(host, 'cover', 1200, 1, () => { cancelledUpdates++; });
  motion.cancel();
  await cancelledCover;
  check(cancelledUpdates === 0 && !host.querySelector('.motion-strip.active'),
    'cancelling during preload must not commit a stale turn');
  const burstHtml = `<style>html{overflow:hidden}body{margin:0;display:flex;width:6000px;height:360px}section{flex:0 0 600px}</style>${
    Array.from({ length: 10 }, (_, i) => `<section>第 ${i + 1} 页</section>`).join('')}`;
  await load(burstHtml);
  motion.prepare(host, 'cover', 'burst-cover');
  const { Reader } = await import('../web/reader.ts');
  const reader = Object.create(Reader.prototype);
  Object.assign(reader, {
    doc: frame.contentDocument, book: { id: 'burst', chapters: [{}] }, chapter: 0,
    page: 0, pages: 10, navigationRevision: 0, turnQueue: Promise.resolve(), motion,
    settings: { mode: 'paged', animation: 'cover', animationDuration: 600 },
    hideSelection() {},
    report() { this.page = Math.round(frame.contentWindow.scrollX / 600); },
  });
  const wheel = deltaY => reader.wheel({ deltaY, deltaX: 0, deltaMode: 1, clientY: 100, preventDefault() {} });
  const burst = Promise.all(Array.from({ length: 8 }, () => wheel(120)));
  for (let page = 1; page <= 8; page++) {
    await until(() => frame.contentWindow.scrollX === page * 600 &&
      host.querySelector('.motion-strip')?.getAnimations({ subtree: true }).length);
    const running = host.querySelector('.motion-strip').getAnimations({ subtree: true });
    check(running.length === 1, 'each queued cover turn must animate a single departing page');
    if (page === 1) {
      await running[0].ready;
      check(running[0].playbackRate > 1, 'queued wheel turns must accelerate the animation');
      running[0].pause();
      await new Promise(resolve => setTimeout(resolve, 40));
      check(frame.contentWindow.scrollX === 600, 'queued turns must not commit before the visible animation finishes');
    }
    running.forEach(animation => animation.finish());
  }
  await burst;
  check(frame.contentWindow.scrollX === 4800, 'a wheel burst must animate all eight pages in order');
  await Promise.all([wheel(-120), wheel(-120), wheel(-120)]);
  check(frame.contentWindow.scrollX === 3000 && frame.style.visibility === '',
    'a reversed wheel burst must finish on its accumulated destination');
  // Two-page spreads turn as StPageFlip's own landscape book, soft or hard, in both directions.
  const { PageFlip } = await import('../web/vendor/page-flip/PageFlip.ts');
  const getRender = PageFlip.prototype.getRender;
  const inspected = new WeakSet();
  const checkedLandings = new WeakSet();
  const spineFaded = new WeakSet();
  let landed = 0;
  PageFlip.prototype.getRender = function () {
    const render = getRender.call(this);
    if (!inspected.has(render)) {
      inspected.add(render);
      const start = render.startAnimation.bind(render);
      render.startAnimation = (frames, time, done) => start(frames.map(draw => () => {
        draw();
        const engine = host.querySelector('.stpageflip-host');
        const spine = host.querySelector('.stpageflip-spine');
        if (engine?.dataset.density === 'soft' && spine?.style.opacity === '0') spineFaded.add(render);
        if (draw !== frames.at(-1) || engine?.dataset.density !== 'soft' || checkedLandings.has(render)) return;
        checkedLandings.add(render);
        render.drawFrame();
        const flap = [...engine.querySelectorAll('.stf__item')].find(item => item.style.zIndex === '5');
        const matrix = new DOMMatrix(getComputedStyle(flap).transform);
        const expectedX = engine.dataset.direction === 'forward' ? 0 : 490;
        check(Math.abs(matrix.e - expectedX) < 1 && Math.abs(matrix.f) < 1 && Math.abs(matrix.b) < .001,
          'the last soft-spread frame must land flat before showing the live page');
        check([...engine.querySelectorAll('.stf__outerShadow, .stf__innerShadow')]
          .every(shadow => getComputedStyle(shadow).opacity === '0'), 'curl shadows must vanish before cleanup');
        // The sheet lands a fraction of a pixel short of the spine; what is left of the page being
        // turned stood there as a hairline (white for an illustration on a dark theme).
        const turned = engine.querySelectorAll('.stf__item')[engine.dataset.direction === 'forward' ? 1 : 2];
        check(turned.style.opacity === '0', 'the page being turned must not linger as a hairline at the spine');
        check(host.querySelector('.stpageflip-spine')?.style.opacity === '1',
          'the spine must be fully back on the landing frame so cleanup does not pop it in');
        check(spineFaded.has(render), 'the spine must fade while the soft flap slides over it');
        // The moved pages stay layered: dropping them mid-hold snapped their text to ClearType.
        check([...engine.querySelectorAll('.stf__item')].some(item => item.style.willChange === 'transform'),
          'moved pages must keep their layers until the landing fade');
        landed++;
      }), time, done);
    }
    return render;
  };
  // At the landing fade only a flat copy of the destination may be left over the live page: pages still in
  // the turn's layers sit at fractional offsets and their resampled text faded soft into the sharp page.
  const landingFade = async overlay => {
    for (let i = 0; i < 600; i++) {
      if (!overlay.isConnected) return null;
      if (overlay.getAnimations().some(a => a.effect.getComputedTiming().duration === 160)) return overlay;
      await new Promise(resolve => setTimeout(resolve, 5));
    }
    return null;
  };
  host.style.width = '980px';
  const spreadHtml = `<style>html{overflow:hidden}body{margin:0;display:flex;width:2940px;height:360px;background:#fffaf3}section{flex:0 0 490px;box-sizing:border-box;padding:30px;font:20px 'Microsoft YaHei'}</style>${
    Array.from({ length: 6 }, (_, i) => `<section><h1>第 ${i + 1} 页</h1></section>`).join('')}`;
  for (const effect of ['turn', 'turn-hard']) {
    for (const direction of [1, -1]) {
      await load(spreadHtml);
      frame.contentWindow.scrollTo(980, 0);
      const target = direction > 0 ? 1960 : 0;
      pending = motion.change(host, effect, 500, direction, () => frame.contentWindow.scrollTo(target, 0), false,
        direction > 0 ? 'top' : 'bottom', true);
      // Until the turn starts, the old spread stays on show: the flat landing copy, loaded with the
      // engine's pages, must not appear over it while slower copies are still loading.
      let early = false;
      await new Promise(resolve => {
        const watch = () => {
          const overlay = host.querySelector('.page-motion');
          early ||= [...(overlay?.querySelectorAll(':scope > .motion-page') ?? [])].some(pane =>
            getComputedStyle(pane).visibility === 'visible' && pane.querySelector('iframe')?.contentWindow?.scrollX === target);
          if (host.querySelector('.stpageflip-host')?.dataset.state === 'flipping') resolve(); else requestAnimationFrame(watch);
        };
        watch();
      });
      check(!early, `${effect} ${direction}: the new spread must not show before the turn starts`);
      const engine = host.querySelector('.stpageflip-host');
      check(engine.dataset.orientation === 'landscape' && engine.dataset.layout === 'double' && engine.dataset.pageCount === '4',
        `${effect} ${direction}: spreads must use the landscape book with four pages`);
      check(Math.abs(engine.getBoundingClientRect().width - 980) < 1, 'the spread engine must fill the reading width');
      check(engine.getAnimations({ subtree: true }).length >= 2 || host.querySelector('.stpageflip-spine')?.getAnimations().length,
        `${effect} ${direction}: the spread turn must play as compositor animations`);
      const halves = [...engine.querySelectorAll('.stpageflip-page .motion-page')];
      check(halves.length === 4 && halves.every((pane, i) => pane.style.width === '980px' && pane.style.left === (i % 2 ? '-490px' : '0px')),
        `${effect} ${direction}: each half page must crop its side of the spread snapshot`);
      // Only the pages that move are pre-promoted, so the turn never rasterizes a page-sized
      // layer mid-flight and the resting spread keeps ClearType.
      const promoted = [...engine.querySelectorAll('.stf__item')].map(item => item.style.willChange === 'transform');
      check(promoted.filter(Boolean).length === 2 && promoted.join() === (direction > 0 ? 'false,false,true,true' : 'true,true,false,false'),
        `${effect} ${direction}: only the two moving pages may get their own compositor layer (${promoted})`);
      // One spine copy rides above the engine's pages and curl shadows, so its first and last
      // frames match the live spine; soft flaps fade it while they slide across (checked at landing).
      const spines = host.querySelectorAll('.stpageflip-spine');
      check(spines.length === 1 && spines[0].parentElement === engine.querySelector('.stf__block') &&
        Number(getComputedStyle(spines[0]).zIndex) > 10, `${effect} ${direction}: the spine must sit above the turning pages and shadows`);
      const landed = await landingFade(host.querySelector('.page-motion'));
      check(landed && getComputedStyle(landed.querySelector('.stpageflip-host')).display === 'none' &&
        [...landed.querySelectorAll(':scope > .motion-page')].some(pane => pane.style.visibility === 'visible' &&
          pane.querySelector('iframe').contentWindow.scrollX === target) && landed.querySelector(':scope > .stpageflip-spine'),
        `${effect} ${direction}: the landed spread must be a flat copy under the spine`);
      await pending;
      check(!host.querySelector('.page-motion') && frame.style.visibility === '' && frame.contentWindow.scrollX === target,
        `${effect} ${direction}: a finished spread turn must show the live spread`);
    }
  }
  // A turn taken while the ready copies are still being made gets its landing copy from them at once and
  // loads the rest. Until it starts, that copy of the new spread must stay hidden under the old one.
  await load(spreadHtml);
  frame.contentWindow.scrollTo(980, 0);
  motion.prepare(host, 'turn-hard', 'partial-pool', true);
  await until(() => motion.standby?.pool.length === 1);
  pending = motion.change(host, 'turn-hard', 500, 1, () => frame.contentWindow.scrollTo(1960, 0), false, 'top', true);
  let shownEarly = false;
  await new Promise(resolve => {
    const watch = () => {
      shownEarly ||= [...host.querySelectorAll('.page-motion > .motion-page')].some(pane =>
        getComputedStyle(pane).visibility === 'visible' && pane.querySelector('iframe')?.contentWindow?.scrollX === 1960);
      if (host.querySelector('.stpageflip-host')?.dataset.state === 'flipping') resolve(); else requestAnimationFrame(watch);
    };
    watch();
  });
  check(!shownEarly, 'a ready landing copy must stay hidden while the other copies load');
  await pending;
  motion.prepare(host, 'none', '');
  // grabfold's fold: single page (forward folds the page off, backward lays the previous one on)
  // and spread, played as Web Animations of transform, clip-path and opacity only; taken by a
  // corner or by the whole free edge.
  for (const effect of ['turn-fold', 'turn-fold-edge']) for (const [width, spread] of [[600, false], [980, true]]) {
    host.style.width = `${width}px`;
    host.style.setProperty('--reading-paper', '#fffaf3');
    for (const direction of [1, -1]) {
      const page = spread ? 490 : width;
      const html = `<style>html{overflow:hidden}body{margin:0;display:flex;width:${page * 6}px;height:360px;background:#fffaf3;color:#37352f}section{flex:0 0 ${page}px;box-sizing:border-box;padding:30px;font:20px/1.8 'Microsoft YaHei'}section:nth-child(odd){background:#fffaf3}section:nth-child(even){background:#eef3f8}</style>${
        Array.from({ length: 6 }, (_, i) => `<section><h1>第 ${i + 1} 页</h1><p>折页从抓起的位置折过来，折痕随手倾斜。</p></section>`).join('')}`;
      await load(html);
      const start = spread ? 980 : width;
      frame.contentWindow.scrollTo(start, 0);
      const target = direction > 0 ? start + (spread ? 980 : width) : start - (spread ? 980 : width);
      pending = motion.change(host, effect, 800, direction, () => frame.contentWindow.scrollTo(target, 0), false,
        direction > 0 ? 'bottom' : 'top', spread);
      await until(() => host.querySelector('.page-motion')?.dataset.fold && host.querySelector('.fold-flap')?.getAnimations().length);
      const overlay = host.querySelector('.page-motion');
      const label = `${effect} ${spread ? 'spread' : 'single'} ${direction}`;
      check(overlay.dataset.fold === (spread ? 'spread' : direction > 0 ? 'single' : 'arriving'), `${label}: wrong fold plan`);
      const animations = overlay.getAnimations({ subtree: true });
      check(animations.length === (spread ? 7 : 8), `${label}: expected one animation per moving part (${animations.length})`);
      // Cuts made by animated clip-paths ran on another clock than the folded face's transform,
      // which then showed on the wrong side of the crease: only transforms and opacity move.
      check(animations.every(animation => animation.effect.getKeyframes().every(frame =>
        Object.keys(frame).every(key => ['offset', 'easing', 'composite', 'computedOffset', 'transform', 'opacity'].includes(key)))),
        `${label}: the fold may only animate transform and opacity`);
      const arriving = !spread && direction < 0;
      check(overlay.querySelectorAll('.motion-page iframe').length === (spread || arriving ? 3 : 2) &&
        (!spread || overlay.querySelector('.fold-face iframe').contentWindow.scrollX === target),
        `${label}: a spread's flap carries a copy of the facing page`);
      const window = overlay.querySelector('.fold-uncovered .fold-half');
      const shown = window.querySelector('iframe').contentWindow.scrollX;
      check(shown === (arriving ? start : target), `${label}: the uncovered window must show ${arriving ? 'the page on show' : 'the destination'}`);
      // The first frame is the page on show: nothing of the destination shows yet.
      animations.forEach(animation => { animation.pause(); animation.currentTime = 0; });
      const seen = (x, y) => {
        const local = new DOMMatrix(getComputedStyle(window).transform).inverse().transformPoint(new DOMPoint(x, y));
        return local.x >= 0 && local.x <= window.offsetWidth && local.y >= 0 && local.y <= window.offsetHeight;
      };
      const middle = seen(page / 2, 180), freeEdge = seen(direction > 0 ? page - 3 : 3, 180);
      if (arriving) check(middle && freeEdge, `${label}: the page on show must start whole`);
      else check(!middle && !freeEdge, `${label}: the destination must start hidden`);      animations.forEach(animation => { animation.currentTime = 320; });
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      await window.captureMotion?.(`${effect}-${spread ? 'spread' : 'single'}-${direction > 0 ? 'forward' : 'backward'}`);
      animations.forEach(animation => animation.play());
      const landed = await landingFade(overlay);
      check(landed && !landed.querySelector('.fold-uncovered, .fold-cell') &&
        (arriving || landed.querySelector(':scope > .fold-page iframe').contentWindow.scrollX === target),
        `${label}: the landed page must be a flat copy, without the turning windows`);
      await pending;
      check(!host.querySelector('.page-motion') && frame.style.visibility === '' && frame.contentWindow.scrollX === target,
        `${label}: a finished fold must show the live page`);
    }
  }
  // A settled page keeps a loaded copy ready, so the next turn covers the live page at once.
  host.style.width = '600px';
  const standbyHtml = `<style>html{overflow:hidden}body{margin:0;display:flex;width:2400px;height:360px;background:#fffaf3}section{flex:0 0 600px;padding:30px;box-sizing:border-box}</style>${
    Array.from({ length: 4 }, (_, i) => `<section><h1>第 ${i + 1} 页</h1></section>`).join('')}`;
  await load(standbyHtml);
  motion.prepare(host, 'turn-fold', 'standby');
  await until(() => host.querySelector('.page-motion-standby .motion-page')?.style.visibility === 'visible');
  const standby = host.querySelector('.page-motion-standby');
  check(standby.querySelector('iframe').contentWindow.scrollX === 0 && getComputedStyle(standby).opacity === '0',
    'the ready copy must show the page on show without being seen');
  // Copies for the turn's own windows are loaded too, one at a time, kept out of sight.
  await until(() => standby.querySelectorAll(':scope > .motion-page').length === 3);
  const pooled = [...standby.querySelectorAll(':scope > .motion-page')].slice(1);
  check(pooled.every(pane => pane.style.visibility === 'hidden'), 'pooled copies must stay hidden until placed');
  // Moving a frame into place must keep its document (moveBefore); a reload would lose this mark.
  for (const pane of pooled) pane.querySelector('iframe').contentWindow.__pooled = true;
  pending = motion.change(host, 'turn-fold', 400, 1, () => frame.contentWindow.scrollTo(600, 0));
  await until(() => host.querySelector('.page-motion .fold-flap')?.getAnimations().length);
  check(host.querySelector('.page-motion') === standby && !host.querySelector('.page-motion-standby'),
    'the turn must take over the ready copy instead of loading another');
  const placed = host.querySelector('.fold-uncovered .motion-page');
  check(pooled.includes(placed) && placed.querySelector('iframe').contentWindow.__pooled === true &&
    placed.querySelector('iframe').contentWindow.scrollX === 600,
    'the uncovered page must be a pooled copy, moved without reloading and scrolled to the destination');
  await pending;
  await until(() => host.querySelector('.page-motion-standby .motion-page')?.style.visibility === 'visible');
  check(host.querySelector('.page-motion-standby iframe').contentWindow.scrollX === 600, 'a new copy must follow the landed page');
  // A page changed underneath (here scrolled away) makes the copy stale; the turn loads its own.
  frame.contentWindow.scrollTo(1200, 0);
  const stale = host.querySelector('.page-motion-standby');
  pending = motion.change(host, 'turn-fold', 400, 1, () => frame.contentWindow.scrollTo(1800, 0));
  await until(() => host.querySelector('.page-motion'));
  check(host.querySelector('.page-motion') !== stale && !stale.isConnected, 'a stale copy must not be used');
  await pending;
  check(frame.contentWindow.scrollX === 1800, 'the turn after a stale copy must still land');
  motion.prepare(host, 'none', '');
  check(!host.querySelector('.page-motion-standby'), 'turning motion off must drop the ready copy');
  PageFlip.prototype.getRender = getRender;
  check(landed === 2, 'both soft-spread directions must paint their flat landing frame');
  host.style.width = '600px';
  motion.setAllowed(false);
  await motion.change(host, 'slide', 600, 1, () => updates++);
  check(updates === 2 && !host.querySelector('.page-motion'), 'disabled motion must commit immediately');
  output.textContent = 'PASS: full-distance slide; StPageFlip single-page soft/hard turns in both directions and viewport shapes; highlights, chapter readiness and cancellation';
  document.documentElement.dataset.result = 'pass';
} catch (error) { output.textContent = 'FAIL\n' + error.stack; document.documentElement.dataset.result = 'fail'; }
</script>
