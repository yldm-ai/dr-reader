<!doctype html>
<meta charset="utf-8">
<title>Touchpad paging and inertia</title>
<pre id="result">RUNNING</pre>
<script type="module">
const output = document.getElementById('result');
const check = (value, message) => { if (!value) throw Error(message); };
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const until = async predicate => {
  for (let i = 0; i < 300; i++) {
    if (predicate()) return;
    await sleep(25);
  }
  throw Error('Timed out waiting for touchpad paging');
};
try {
  const frame = document.createElement('iframe');
  frame.style.cssText = 'width:1200px;height:800px;border:0';
  let html = await (await fetch('../dist/index.html')).text();
  frame.srcdoc = html.replace('<head>', `<head><base href="${location.origin}/dist/"><script type="module" src="/tests/native-mock.js?touchpad"><\/script>`);
  document.body.append(frame);
  await until(() => frame.contentDocument?.querySelector('.book-card'));
  const doc = frame.contentDocument;
  doc.querySelector('.book-card').click();
  await until(() => !doc.getElementById('reader-view').hidden && doc.getElementById('reader-loading').hidden);
  const content = doc.getElementById('book-frame').contentDocument;
  const page = () => Number(doc.getElementById('page-indicator').textContent.split('/')[0]);
  const gesture = async direction => {
    for (const delta of [2, 9, 24, 64, 120, 98, 77, 52, 38, 22, 12, 8, 5, 3, 1]) {
      const event = new content.defaultView.WheelEvent('wheel', { deltaY: delta * direction, deltaMode: 0, clientY: 100, bubbles: true, cancelable: true });
      content.dispatchEvent(event);
      check(event.defaultPrevented, 'paged touchpad events must not scroll the document itself');
      await sleep(16);
    }
  };
  check(page() === 1, 'reader starts at first page');
  await gesture(1);
  await until(() => !doc.querySelector('.page-motion'));
  check(page() === 2, 'a real-time smooth swipe with inertia turns just one page');
  await sleep(700);
  check(page() === 2, 'no queued turns continue after the gesture finishes');
  await gesture(1);
  await until(() => !doc.querySelector('.page-motion'));
  check(page() === 3, 'a second separate swipe turns the next page');
  await sleep(240);
  await gesture(-1);
  await until(() => !doc.querySelector('.page-motion'));
  check(page() === 2, 'a deliberate reverse swipe turns back');
  const zoom = new content.defaultView.WheelEvent('wheel', { deltaY: 100, ctrlKey: true, bubbles: true, cancelable: true });
  content.dispatchEvent(zoom);
  check(!zoom.defaultPrevented && page() === 2, 'pinch/zoom gestures keep their default behavior');
  check(!frame.contentWindow.runtimeErrors.length, frame.contentWindow.runtimeErrors.join('\n'));
  document.documentElement.dataset.result = 'pass'; output.textContent = 'PASS touchpad gestures and inertia';
} catch (error) {
  document.documentElement.dataset.result = 'fail'; output.textContent = error.stack;
}
</script>
