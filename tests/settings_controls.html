<!doctype html>
<meta charset="utf-8">
<title>Settings control regression</title>
<link rel="stylesheet" href="../web/styles.css">
<pre id="result">RUNNING</pre>
<script type="module">
import { bootstrapFixture, installNativeMock } from './frontend-fixtures.js';
const output = document.getElementById('result');
const check = (value, label) => { if (!value) throw Error(label); };
const frame = () => new Promise(resolve => requestAnimationFrame(resolve));
const key = (target, value) => target.dispatchEvent(new KeyboardEvent('keydown', { key: value, bubbles: true, cancelable: true }));
const watchdog = setTimeout(() => { output.textContent = 'FAIL: settings timed out'; document.documentElement.dataset.result = 'fail'; }, 12000);
try {
  const html = new DOMParser().parseFromString(await (await fetch('../web/index.html')).text(), 'text/html');
  document.body.append(...html.body.children);
  const data = bootstrapFixture();
  const native = installNativeMock(data);
  const { SettingsPanel } = await import('../web/settings.js');
  let changes = 0;
  const panel = new SettingsPanel(() => changes++);
  panel.configure(data);
  panel.open('reading');
  const font = panel.selectControls.get('fontFamily');
  check(font.button.textContent.includes('默认衬线字体'), 'generic font must display a friendly label');
  font.open();
  check(font.list.querySelectorAll('[role=option]').length <= 81, 'large font list must have bounded DOM');
  font.search.value = 'yahei'; font.search.dispatchEvent(new Event('input'));
  check(panel.value.reading.fontFamily === 'serif', 'typing a font search must not persist it');
  check(font.list.querySelectorAll('[role=option]').length === 1, 'font search must be case insensitive and deduplicated');
  key(font.search, 'Enter');
  await frame();
  check(panel.value.reading.fontFamily === 'Microsoft YaHei', 'font selection saved the wrong value');
  check(!font.isOpen && font.button.textContent.includes('Microsoft YaHei'), 'font trigger did not update');
  await panel.flush();
  check(native.data.settings.reading.fontFamily === 'Microsoft YaHei', 'font selection did not persist');
  font.open();
  font.search.value = 'no such font'; font.search.dispatchEvent(new Event('input'));
  key(font.search, 'Enter');
  check(font.isOpen && panel.value.reading.fontFamily === 'Microsoft YaHei', 'empty search must not commit a font');
  key(font.search, 'Escape');
  check(!font.isOpen && document.getElementById('reading-settings').open, 'Escape must close the font menu before the settings drawer');
  font.open();
  document.getElementById('setting-mode-trigger').click();
  check(!font.isOpen, 'opening another selector must light-dismiss the old menu');
  const mode = panel.selectControls.get('mode');
  key(mode.button, 'ArrowDown'); key(mode.button, 'Enter');
  await frame();
  check(panel.value.reading.mode === 'scroll', 'keyboard selection must change reading mode');
  const dictionaryRow = document.querySelector('.dictionary-row');
  const before = changes;
  for (let i = 21; i <= 30; i++) panel.update('reading', { fontSize: i });
  await frame();
  check(changes === before + 1, 'slider updates must coalesce within a frame');
  check(document.querySelector('.dictionary-row') === dictionaryRow, 'reading changes must not recreate dictionary rows');
  document.getElementById('reset-reading').click();
  await panel.flush();
  check(font.button.textContent.includes('默认衬线字体') && mode.button.textContent.includes('左右翻页'), 'reset must sync displayed labels and saved values');
  panel.configure({ ...data, settings: structuredClone(native.data.settings) });
  check(font.button.textContent.includes('默认衬线字体'), 'reloaded settings must restore font labels');
  // The lower selectors must open above the trigger and stay within the viewport.
  const animation = panel.selectControls.get('animation');
  animation.button.scrollIntoView({ block: 'end' });
  animation.open();
  let rect = animation.popup.getBoundingClientRect();
  check(rect.top >= 0 && rect.bottom <= innerHeight && rect.right <= innerWidth, 'popup extends outside viewport');
  animation.close();
  document.getElementById('reading-settings').close();
  output.textContent = 'PASS: font search/commit/cancel/persist/reset, selector keyboard and bounds, batched updates, stable dictionary DOM';
  document.documentElement.dataset.result = 'pass';
} catch (error) {
  output.textContent = 'FAIL\n' + error.stack;
  document.documentElement.dataset.result = 'fail';
}
clearTimeout(watchdog);
</script>
