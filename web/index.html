<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' https://books.dr-reader.local 'unsafe-inline'; img-src 'self' https://books.dr-reader.local data:; connect-src 'self' https://books.dr-reader.local; font-src 'self' https://books.dr-reader.local; frame-src 'self' about:; object-src 'none'"
    />
    <title>DR Reader</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" data-icon="book"></span>
          <div>DR Reader<small>留一点时间给阅读</small></div>
        </div>
        <button id="import-side" class="primary import-button">
          <span data-icon="plus"></span>添加电子书<kbd>Ctrl O</kbd>
        </button>
        <div class="nav-label">我的书库</div>
        <nav id="library-nav">
          <button class="nav-item active" data-filter="all">
            <span data-icon="library"></span>全部图书<span
              class="count"
              id="count-all"
              >0</span
            >
          </button>
          <button class="nav-item" data-filter="recent">
            <span data-icon="clock"></span>最近阅读<span
              class="count"
              id="count-recent"
              >0</span
            >
          </button>
          <button class="nav-item" data-filter="unread">
            <span data-icon="bookmark"></span>尚未开始
          </button>
          <button class="nav-item" data-filter="finished">
            <span data-icon="check"></span>已经读完
          </button>
        </nav>
        <div class="nav-label separated">浏览分类</div>
        <button id="authors-toggle" class="nav-item">
          <span data-icon="user"></span>作者<span
            data-icon="chevron"
            class="small-icon trailing"
          ></span>
        </button>
        <div id="authors" class="author-list" hidden></div>
        <div class="sidebar-bottom">
          <div class="local-note">
            <span class="status-dot"></span>本地书库<small
              >你的书，留在你的电脑里</small
            >
          </div>
          <button id="open-settings" class="nav-item">
            <span data-icon="settings"></span>设置与外观
          </button>
        </div>
      </aside>
      <main id="library-view" class="library-view">
        <header class="library-header">
          <div class="eyebrow">YOUR PERSONAL LIBRARY</div>
          <div class="heading-row">
            <div>
              <h1 id="library-heading">
                全部图书<span id="heading-count">0</span>
              </h1>
              <p id="library-subtitle">翻开一本书，让世界慢下来。</p>
            </div>
            <button id="import-main" class="primary">
              <span data-icon="plus"></span>添加图书
            </button>
          </div>
        </header>
        <section id="continue-section" class="continue-section" hidden>
          <div class="section-label">
            接着上次的故事 <span>CONTINUE READING</span>
          </div>
          <button id="continue-book" class="continue-card"></button>
        </section>
        <div class="library-toolbar">
          <label class="search-field"
            ><span data-icon="search"></span
            ><input
              id="library-search"
              type="search"
              placeholder="搜索书名、作者…"
              aria-label="搜索书库"
            /><kbd>Ctrl K</kbd></label
          >
          <div class="toolbar-right">
            <select id="sort" aria-label="图书排序">
              <option value="added">最近添加</option>
              <option value="read">最近阅读</option>
              <option value="title">书名排序</option>
              <option value="author">作者排序</option>
            </select>
            <div class="view-toggle">
              <button
                id="grid-view"
                class="icon-button selected"
                title="网格视图"
                aria-label="网格视图"
              >
                <span data-icon="grid"></span></button
              ><button
                id="list-view"
                class="icon-button"
                title="列表视图"
                aria-label="列表视图"
              >
                <span data-icon="list"></span>
              </button>
            </div>
          </div>
        </div>
        <div id="book-grid" class="book-grid"></div>
        <div id="empty-state" class="empty-state" hidden>
          <span data-icon="book"></span>
          <h2>下一段故事，从这里开始</h2>
          <p>添加一本 EPUB，建立属于自己的书架。</p>
          <button id="import-empty" class="primary">选择 EPUB 文件</button>
        </div>
        <footer class="library-footer">
          <span id="library-total">0 本图书</span
          ><span>一本书，一段不被打扰的时光。</span><span>EPUB · 本地阅读</span>
        </footer>

      </main>
      <main id="reader-view" class="reader-view" hidden>
        <header class="reader-toolbar">
          <button id="back-library" class="text-button">
            <span data-icon="arrow-left"></span>书库</button
          ><span class="toolbar-divider"></span>
          <div class="reader-book-title" id="reader-book-title"></div>
          <div class="reader-actions"><button id="reader-app-settings" class="icon-button" title="应用设置" aria-label="应用设置"><span data-icon="settings"></span></button>
            <button
              id="toggle-toc"
              class="icon-button"
              title="显示 / 隐藏目录"
              aria-label="显示 / 隐藏目录"
            >
              <span data-icon="list"></span></button
            ><button
              id="add-bookmark"
              class="icon-button"
              title="添加 / 移除此处书签"
              aria-label="添加 / 移除此处书签"
            >
              <span data-icon="bookmark"></span></button
            ><button id="reader-settings" class="text-button">
              <span data-icon="type"></span>阅读设置
            </button>
          </div>
        </header>
        <div class="reader-workspace">
          <aside id="toc-panel" class="toc-panel">
            <div class="toc-tabs">
              <button data-tab="toc" class="active">目录</button
              ><button data-tab="marks">书签</button
              ><button data-tab="notes">笔记</button
              ><button data-tab="search">搜索</button>
            </div>
            <div id="toc-content"></div>
            <div id="marks-content" hidden></div>
            <div id="notes-content" hidden></div>
            <div id="search-content" hidden>
              <form id="book-search-form" class="book-search">
                <input
                  id="book-search-input"
                  type="search"
                  placeholder="搜索书内文字"
                  aria-label="搜索书内文字"
                /><button
                  class="icon-button"
                  type="submit"
                  aria-label="开始搜索"
                >
                  <span data-icon="search"></span>
                </button>
              </form>
              <div id="search-results" class="search-results">
                <p class="panel-hint">由 C++ 在本地检索正文。</p>
              </div>
            </div>
          </aside>
          <section class="reading-area">
            <div id="chapter-label" class="chapter-label"></div>
            <div id="page-surface" class="page-surface">
              <iframe
                id="book-frame"
                title="电子书正文"
                sandbox="allow-same-origin"
              ></iframe>
              <div id="reader-loading" class="reader-loading" hidden>
                正在打开这一页…
              </div>
            </div>
            <div class="reader-pagination">
              <button id="prev-page" class="text-button">
                <span data-icon="arrow-left"></span>上一页</button
              ><span id="page-indicator"></span
              ><button id="next-page" class="text-button">
                下一页<span data-icon="arrow-right"></span>
              </button>
            </div>
          </section>
        </div>
        <footer class="reader-footer">
          <span id="reader-location"></span
          ><input
            id="reading-progress"
            type="range"
            min="0"
            max="1000"
            value="0"
            aria-label="全书阅读进度"
          /><span id="reader-percent">0%</span>
        </footer>
        <div id="reader-quick-controls" class="reader-quick-controls" hidden>
          <button id="quick-library" class="text-button" type="button"><span data-icon="arrow-left"></span>书库</button>
          <button id="quick-settings" class="text-button" type="button"><span data-icon="type"></span>阅读设置 <kbd>F8</kbd></button>
          <button id="quick-fullscreen" class="text-button" type="button">退出全屏</button>
        </div>
      </main>
    </div>

    <div id="selection-menu" class="selection-menu" hidden>
      <div class="selection-preview" id="selection-preview"></div>
      <div class="selection-tools">
        <div class="selection-group" id="selection-highlight">
          <span class="selection-label">高亮</span>
          <button data-color="yellow" class="color-dot yellow" aria-label="黄色高亮"></button>
          <button data-color="green" class="color-dot green" aria-label="绿色高亮"></button>
          <button data-color="blue" class="color-dot blue" aria-label="蓝色高亮"></button>
          <button data-color="pink" class="color-dot pink" aria-label="粉色高亮"></button>
          <button data-color="purple" class="color-dot purple" aria-label="紫色高亮"></button>
        </div>
        <span class="selection-divider"></span>
        <button id="selection-underline" class="selection-action"><span data-icon="underline"></span>下划线</button>
        <button id="selection-delete" class="selection-action danger-button" hidden><span data-icon="delete"></span>删除标注</button>
        <button id="selection-note" class="selection-action"><span data-icon="note"></span>记笔记</button>
        <button id="selection-copy" class="selection-action"><span data-icon="copy"></span>复制</button>
        <button id="selection-search" class="selection-action"><span data-icon="search"></span>书内搜索</button>
        <button id="selection-dictionary" class="selection-action dictionary-action">查词 <span data-icon="chevron"></span></button>
      </div>
    </div>

    <dialog id="annotation-dialog" class="annotation-dialog">
      <form id="annotation-form" method="dialog">
        <div class="annotation-header">
          <div><span class="eyebrow">ANNOTATION</span><h2 id="annotation-title">记笔记</h2></div>
          <button value="cancel" class="icon-button" aria-label="关闭笔记"><span data-icon="close"></span></button>
        </div>
        <blockquote id="annotation-quote"></blockquote>
        <label class="annotation-note-label">笔记<textarea id="annotation-note" rows="6" maxlength="32768" placeholder="写下此刻的想法…"></textarea></label>
        <div class="annotation-style-row">
          <span>颜色</span>
          <div class="annotation-colors">
            <button type="button" data-annotation-color="yellow" class="color-dot yellow" aria-label="黄色"></button>
            <button type="button" data-annotation-color="green" class="color-dot green" aria-label="绿色"></button>
            <button type="button" data-annotation-color="blue" class="color-dot blue" aria-label="蓝色"></button>
            <button type="button" data-annotation-color="pink" class="color-dot pink" aria-label="粉色"></button>
            <button type="button" data-annotation-color="purple" class="color-dot purple" aria-label="紫色"></button>
          </div>
          <select id="annotation-style" aria-label="标注样式">
            <option value="highlight">高亮</option>
            <option value="underline">下划线</option>
          </select>
        </div>
        <div class="annotation-actions">
          <button id="annotation-delete" type="button" class="danger-button" hidden>删除标注</button>
          <span></span>
          <button value="cancel" class="text-button">取消</button>
          <button id="annotation-save" type="submit" class="primary">保存笔记</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>
    <div id="busy" class="busy" hidden>
      <span class="spinner"></span><span id="busy-label">正在处理电子书…</span>
    </div>
  </body>
</html>
