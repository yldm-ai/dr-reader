<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' https://books.dr-reader.local 'unsafe-inline'; img-src 'self' https://books.dr-reader.local data:; connect-src 'self' https://books.dr-reader.local; font-src 'self' https://books.dr-reader.local; frame-src 'self' about:; object-src 'none'"
    />
    <title>DR Reader</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.ts"></script>
  </head>
  <body class="booting">
    <div id="app" class="app">
      <!-- The library home keeps Segoe Fluent glyphs; the reader uses Material Symbols. -->
      <aside class="sidebar" data-icon-set="fluent">
        <div class="brand">
          <span class="brand-mark" data-icon="book"></span>
          <div>DR Reader<small>留一点时间给阅读</small></div>
        </div>
        <button id="import-side" class="primary import-button">
          <span data-icon="plus"></span>添加电子书<kbd>Ctrl O</kbd>
        </button>
        <div class="nav-label">我的书库</div>
        <nav id="library-nav">
          <span class="library-nav-indicator" aria-hidden="true"></span>
          <button class="nav-item active" data-filter="all">
            <span data-icon="all-books"></span>全部图书<span
              class="count"
              id="count-all"
              >0</span
            >
          </button>
          <button class="nav-item" data-filter="recent">
            <span data-icon="clock"></span>最近阅读<span
              class="count"
              id="count-recent"
              >0</span
            >
          </button>
          <button class="nav-item" data-filter="shelves">
            <span data-icon="library"></span>分类书架<span class="count" id="count-shelves">0</span>
          </button>
          <button class="nav-item" data-filter="unread">
            <span data-icon="unread"></span>尚未开始<span class="count" id="count-unread">0</span>
          </button>
          <button class="nav-item" data-filter="finished">
            <span data-icon="check"></span>已经读完<span class="count" id="count-finished">0</span>
          </button>
        </nav>
        <div class="nav-label separated">浏览分类</div>
        <button id="authors-toggle" class="nav-item">
          <span data-icon="user"></span>作者<span
            data-icon="chevron"
            class="small-icon trailing"
          ></span>
        </button>
        <div id="authors" class="author-list" hidden></div>
        <div class="sidebar-bottom">
          <button id="open-settings" class="nav-item">
            <span data-icon="settings"></span>设置与外观
          </button>
        </div>
      </aside>
      <main id="library-view" class="library-view" data-icon-set="fluent">
        <header class="library-header">
          <div class="eyebrow">YOUR PERSONAL LIBRARY</div>
          <div class="heading-row">
            <div>
              <h1 id="library-heading" tabindex="-1">
                全部图书<span id="heading-count">0</span>
              </h1>
            </div>
          </div>
        </header>
        <div class="library-toolbar">
          <label class="search-field"
            ><span data-icon="search"></span
            ><input
              id="library-search"
              type="search"
              placeholder="搜索书名、作者…"
              aria-label="搜索书库"
            /><kbd>Ctrl K</kbd></label
          >
          <div class="toolbar-right">
            <select id="sort" aria-label="图书排序">
              <option value="added">最近添加</option>
              <option value="read">最近阅读</option>
              <option value="title">书名排序</option>
              <option value="author">作者排序</option>
            </select>
            <div class="view-toggle">
              <button
                id="grid-view"
                class="icon-button selected"
                title="网格视图"
                aria-label="网格视图"
              >
                <span data-icon="grid"></span></button
              ><button
                id="list-view"
                class="icon-button"
                title="列表视图"
                aria-label="列表视图"
              >
                <span data-icon="list"></span>
              </button>
            </div>
          </div>
        </div>
        <div id="shelf-actions" class="shelf-actions" hidden>
          <button id="shelves-back" class="text-button" data-icon-set="material"><span data-icon="arrow-left"></span>全部书架</button>
          <button id="shelf-edit" class="text-button">编辑书架与图书</button>
        </div>
        <div id="shelf-grid" class="shelf-grid" hidden></div>
        <!-- Placeholder cards hold the library's shape until bootstrap; render() replaces them. -->
        <div id="book-grid" class="book-grid" aria-busy="true">
          <div class="book-item book-skeleton" aria-hidden="true"><div class="skeleton-cover"></div><span class="skeleton-line"></span><span class="skeleton-line short"></span></div>
          <div class="book-item book-skeleton" aria-hidden="true"><div class="skeleton-cover"></div><span class="skeleton-line"></span><span class="skeleton-line short"></span></div>
          <div class="book-item book-skeleton" aria-hidden="true"><div class="skeleton-cover"></div><span class="skeleton-line"></span><span class="skeleton-line short"></span></div>
          <div class="book-item book-skeleton" aria-hidden="true"><div class="skeleton-cover"></div><span class="skeleton-line"></span><span class="skeleton-line short"></span></div>
          <div class="book-item book-skeleton" aria-hidden="true"><div class="skeleton-cover"></div><span class="skeleton-line"></span><span class="skeleton-line short"></span></div>
          <div class="book-item book-skeleton" aria-hidden="true"><div class="skeleton-cover"></div><span class="skeleton-line"></span><span class="skeleton-line short"></span></div>
          <div class="book-item book-skeleton" aria-hidden="true"><div class="skeleton-cover"></div><span class="skeleton-line"></span><span class="skeleton-line short"></span></div>
          <div class="book-item book-skeleton" aria-hidden="true"><div class="skeleton-cover"></div><span class="skeleton-line"></span><span class="skeleton-line short"></span></div>
          <div class="book-item book-skeleton" aria-hidden="true"><div class="skeleton-cover"></div><span class="skeleton-line"></span><span class="skeleton-line short"></span></div>
          <div class="book-item book-skeleton" aria-hidden="true"><div class="skeleton-cover"></div><span class="skeleton-line"></span><span class="skeleton-line short"></span></div>
          <div class="book-item book-skeleton" aria-hidden="true"><div class="skeleton-cover"></div><span class="skeleton-line"></span><span class="skeleton-line short"></span></div>
          <div class="book-item book-skeleton" aria-hidden="true"><div class="skeleton-cover"></div><span class="skeleton-line"></span><span class="skeleton-line short"></span></div>
        </div>
        <div id="empty-state" class="empty-state" hidden>
          <span data-icon="book"></span>
          <h2>下一段故事，从这里开始</h2>
          <p>添加一本 EPUB，建立属于自己的书架。</p>
          <button id="import-empty" class="primary">选择 EPUB 文件</button>
        </div>
        <button id="library-back-to-top" class="library-back-to-top" type="button" aria-label="回到顶部" title="回到顶部" aria-hidden="true" inert data-icon-set="material">
          <span data-icon="arrow-up"></span>
        </button>
      </main>
      <main id="reader-view" class="reader-view" hidden>
        <header id="reader-toolbar" class="reader-toolbar">
          <div class="toolbar-start">
            <button id="back-library" class="text-button">
              <span data-icon="arrow-left"></span>书库</button
            ><span class="toolbar-divider"></span
            ><button
              id="toggle-toc"
              class="icon-button"
              title="目录与笔记"
              aria-label="显示 / 隐藏目录"
            >
              <span data-icon="toc"></span></button>
            <div class="reader-book-title" id="reader-book-title"></div>
          </div>
          <!-- Everyday typesetting stays one click away; the drawer keeps the full set. -->
          <div class="toolbar-quick" role="group" aria-label="快速排版">
            <!-- Reading mode: 翻页 opens a submenu for one or two pages; 滚动 applies at once. -->
            <button type="button" id="reading-mode-button" class="quick-dropdown" aria-haspopup="menu" aria-expanded="false" aria-controls="reading-mode-menu" title="阅读方式">
              <span id="reading-mode-icon" class="quick-dropdown-icon"></span><span id="reading-mode-label">单页</span><span class="quick-chevron" data-icon="chevron-down"></span>
            </button>
            <div id="reading-mode-menu" class="reader-menu" popover="manual" role="menu" aria-label="阅读方式">
              <button type="button" class="reader-menu-item" role="menuitem" data-mode-item="paged" aria-haspopup="menu" aria-expanded="false" aria-controls="reading-layout-menu" tabindex="-1">
                <span data-icon="paged"></span><span class="reader-menu-label">翻页</span><span class="reader-menu-check" data-icon="check"></span><span class="reader-menu-more" data-icon="chevron"></span>
              </button>
              <button type="button" class="reader-menu-item" role="menuitemradio" data-mode-item="scroll" aria-checked="false" tabindex="-1">
                <span data-icon="scroll"></span><span class="reader-menu-label">滚动</span><span class="reader-menu-check" data-icon="check"></span>
              </button>
              <div id="reading-layout-menu" class="reader-menu reader-submenu" popover="manual" role="menu" aria-label="翻页方式">
                <button type="button" class="reader-menu-item" role="menuitemradio" data-layout-item="single" aria-checked="false" tabindex="-1">
                  <span data-icon="page-single"></span><span class="reader-menu-label">单页</span><span class="reader-menu-check" data-icon="check"></span>
                </button>
                <button type="button" class="reader-menu-item" role="menuitemradio" data-layout-item="double" aria-checked="false" tabindex="-1">
                  <span data-icon="page-double"></span><span class="reader-menu-label">双页</span><span class="reader-menu-check" data-icon="check"></span>
                </button>
              </div>
            </div>
            <span class="quick-divider" aria-hidden="true"></span>
            <button type="button" id="reading-theme-button" class="quick-dropdown" aria-haspopup="dialog" aria-expanded="false" aria-controls="reading-theme-panel" title="页面主题">
              <span id="reading-theme-swatch" class="quick-swatch" aria-hidden="true"></span><span class="quick-chevron" data-icon="chevron-down"></span>
            </button>
            <div id="reading-theme-panel" class="reader-menu theme-panel" popover="manual" role="dialog" aria-label="页面主题">
              <h3 id="theme-panel-colors">颜色</h3>
              <div id="theme-panel-papers" class="theme-papers" role="radiogroup" aria-labelledby="theme-panel-colors"></div>
              <h3 id="theme-panel-backgrounds">背景</h3>
              <div id="theme-panel-textures" class="theme-textures" role="radiogroup" aria-labelledby="theme-panel-backgrounds"></div>
            </div>
            <span class="quick-divider" aria-hidden="true"></span>
            <div class="quick-font" role="group" aria-label="字号">
              <button type="button" id="font-smaller" class="quick-button" title="减小字号" aria-label="减小字号"><span data-icon="minus"></span></button
              ><output id="quick-font-size" aria-live="polite" title="字号"></output
              ><button type="button" id="font-larger" class="quick-button" title="增大字号" aria-label="增大字号"><span data-icon="plus"></span></button>
            </div>
          </div>
          <div class="reader-actions">
            <button id="reader-search" class="icon-button" title="书内搜索 (Ctrl F)" aria-label="书内搜索"><span data-icon="search"></span></button
            ><button
              id="add-bookmark"
              class="icon-button"
              title="添加 / 移除此处书签"
              aria-label="添加 / 移除此处书签"
            >
              <span class="bookmark-off" data-icon="bookmark"></span><span class="bookmark-on" data-icon="bookmark-filled"></span></button
            ><button id="reader-book-info" class="icon-button" title="图书信息" aria-label="图书信息" data-icon-set="fluent"><span data-icon="book-info"></span></button
            ><button id="reader-fullscreen" class="icon-button" title="全屏 (F11)" aria-label="切换全屏"><span class="fullscreen-enter" data-icon="fullscreen"></span><span class="fullscreen-leave" data-icon="fullscreen-exit"></span></button
            ><span class="toolbar-divider"></span
            ><button id="reader-app-settings" class="icon-button" title="应用设置" aria-label="应用设置"><span data-icon="settings"></span></button
            ><button id="reader-settings" class="text-button reader-settings-button" title="阅读设置 (F8)">
              <span data-icon="cookie"></span>阅读设置
            </button
            ><button id="collapse-toolbar" class="icon-button" title="收起工具栏" aria-label="收起工具栏" aria-controls="reader-toolbar" aria-expanded="true"><span data-icon="collapse"></span></button>
          </div>
        </header>
        <!-- Revealed by hovering the top-right corner while collapsed, where the collapse button was. -->
        <button id="corner-settings" class="text-button corner-button corner-settings" type="button" title="阅读设置 (F8)"><span data-icon="cookie"></span>阅读设置</button>
        <button id="expand-toolbar" class="icon-button corner-button expand-toolbar" type="button" title="展开工具栏" aria-label="展开工具栏" aria-controls="reader-toolbar" aria-expanded="false"><span data-icon="expand"></span></button>
        <div class="reader-workspace">
          <div id="toc-reveal-zone" class="toc-reveal-zone" aria-hidden="true"></div>
          <aside id="toc-panel" class="toc-panel">
            <!-- The rounded panel stays still; this layer scrolls under an inset overlay scrollbar. -->
            <div id="toc-scroll" class="toc-scroll">
            <div class="toc-header">
            <div class="toc-tabs">
              <button data-tab="toc" class="active">目录</button
              ><button data-tab="marks">书签</button
              ><button data-tab="notes">笔记</button
              ><button data-tab="search">搜索</button
              ><button data-tab="ask">问书</button>
            </div>
            <button id="pin-toc" class="icon-button toc-pin" aria-label="固定侧边栏" aria-pressed="false" title="固定侧边栏"><span data-icon="pin"></span></button>
            </div>
            <div id="toc-content"></div>
            <div id="marks-content" hidden></div>
            <div id="notes-content" hidden></div>
            <div id="search-content" hidden>
              <form id="book-search-form" class="book-search">
                <input
                  id="book-search-input"
                  type="search"
                  placeholder="搜索书内文字"
                  aria-label="搜索书内文字"
                /><button
                  class="icon-button"
                  type="submit"
                  aria-label="开始搜索"
                >
                  <span data-icon="search"></span>
                </button>
              </form>
              <div id="search-results" class="search-results">
                <p class="panel-hint">由 C++ 在本地检索正文。</p>
              </div>
            </div>
            <div id="ask-content" hidden></div>
            </div>
          </aside>
          <section class="reading-area">
            <div id="chapter-label" class="chapter-label"></div>
            <div id="page-surface" class="page-surface">
              <iframe
                id="book-frame"
                title="电子书正文"
                sandbox="allow-same-origin"
              ></iframe>
              <div id="reader-loading" class="reader-loading" hidden>
                正在打开这一页…
              </div>
            </div>
            <div class="reader-pagination">
              <button id="prev-page" class="text-button">
                <span data-icon="arrow-left"></span>上一页</button
              ><span id="page-indicator"></span
              ><button id="next-page" class="text-button">
                下一页<span data-icon="arrow-right"></span>
              </button>
            </div>
          </section>
        </div>
        <div id="footer-reveal-zone" class="footer-reveal-zone" aria-hidden="true" hidden></div>
        <footer class="reader-footer" aria-label="底部阅读信息栏">
          <span id="reader-location"></span
          ><span id="book-pages" class="book-pages" hidden></span
          ><input
            id="reading-progress"
            type="range"
            min="0"
            max="1000"
            value="0"
            aria-label="全书阅读进度"
          /><span id="reader-percent">0%</span>
        </footer>
        <!-- With the toolbar collapsed, the top corners reveal these on hover. -->
        <button id="corner-library" class="text-button corner-button corner-library" type="button" title="返回书库"><span data-icon="arrow-left"></span>书库</button>
      </main>
    </div>

    <div id="selection-menu" class="selection-menu" hidden>
      <div class="selection-tools">
        <!-- Each mark keeps one colour in front of its button; the dot opens the recent colours.
             A pressed button means the passage already carries that mark: pressing again removes it. -->
        <div class="mark-group" id="selection-highlight-group">
          <button id="highlight-color" class="mark-color" type="button" data-style="highlight" title="高亮颜色" aria-label="选择高亮颜色" aria-haspopup="true"></button>
          <button id="selection-highlight" class="selection-action mark-action" type="button" aria-pressed="false"><span data-icon="highlighter" data-icon-set="fluent"></span><span class="selection-action-label">高亮</span></button>
        </div>
        <div class="mark-group" id="selection-underline-group">
          <button id="underline-color" class="mark-color" type="button" data-style="underline" title="下划线颜色" aria-label="选择下划线颜色" aria-haspopup="true"></button>
          <button id="selection-underline" class="selection-action mark-action" type="button" aria-pressed="false"><span data-icon="underline" data-icon-set="fluent"></span><span class="selection-action-label">下划线</span></button>
        </div>
        <span class="selection-divider"></span>
        <button id="selection-note" class="selection-action"><span data-icon="edit" data-icon-set="fluent"></span><span id="selection-note-label" class="selection-action-label">记笔记</span></button>
        <button id="selection-note-delete" class="selection-action danger-button" hidden><span data-icon="delete" data-icon-set="fluent"></span><span class="selection-action-label">删除笔记</span></button>
        <button id="selection-copy" class="selection-action"><span data-icon="copy" data-icon-set="fluent"></span><span class="selection-action-label">复制</span></button>
        <button id="selection-search" class="selection-action"><span data-icon="search" data-icon-set="fluent"></span><span class="selection-action-label">书内搜索</span></button>
        <button id="selection-ask" class="selection-action"><span data-icon="ask" data-icon-set="fluent"></span><span class="selection-action-label">问 AI</span></button>
        <button id="selection-dictionary" class="selection-action dictionary-action"><span class="selection-action-label">查词</span><span data-icon="chevron"></span></button>
      </div>
      <!-- The five most recent colours, then the custom colour picker. -->
      <div id="mark-palette" class="mark-palette" role="group" aria-label="标注颜色" hidden>
        <span id="highlight-swatches" class="swatch-row"></span>
      </div>
    </div>
    <!-- The note of a marked passage, shown while the pointer rests on it. -->
    <div id="note-peek" class="note-peek" role="tooltip" hidden>
      <div class="note-peek-text" id="note-peek-text"></div>
    </div>

    <dialog id="annotation-dialog" class="annotation-dialog" aria-labelledby="annotation-title">
      <form id="annotation-form" method="dialog">
        <div class="annotation-header">
          <h2 id="annotation-title">记笔记</h2>
          <button value="cancel" class="icon-button" aria-label="关闭笔记"><span data-icon="close"></span></button>
        </div>
        <!-- The quote previews the chosen mark: highlighted, underlined or plain. -->
        <blockquote id="annotation-quote" data-style="highlight"></blockquote>
        <textarea id="annotation-note" rows="4" maxlength="32768" placeholder="写下此刻的想法…" aria-label="笔记"></textarea>
        <div class="annotation-style-row">
          <span id="annotation-style-label">样式</span>
          <div id="annotation-style" class="segmented" role="radiogroup" aria-labelledby="annotation-style-label">
            <label><input type="radio" name="annotation-style" value="highlight" checked><span>高亮</span></label
            ><label><input type="radio" name="annotation-style" value="underline"><span>下划线</span></label
            ><label><input type="radio" name="annotation-style" value="note"><span>仅笔记</span></label>
          </div>
        </div>
        <div class="annotation-style-row annotation-color-row">
          <span>颜色</span>
          <div id="annotation-swatches" class="annotation-colors swatch-row"></div>
        </div>
        <div class="annotation-actions">
          <button id="annotation-delete" type="button" class="danger-button" hidden>删除标注</button>
          <span></span>
          <button value="cancel" class="text-button">取消</button>
          <button id="annotation-save" type="submit" class="primary">保存笔记</button>
        </div>
      </form>
    </dialog>

    <dialog id="delete-book-dialog" class="annotation-dialog" aria-labelledby="delete-book-title" aria-describedby="delete-book-description">
      <form method="dialog">
        <div class="annotation-header"><h2 id="delete-book-title">删除图书？</h2></div>
        <p id="delete-book-description">将删除阅读器中的图书、阅读进度、书签和标注，无法撤销。原始 EPUB 文件会保留。</p>
        <div class="annotation-actions">
          <span></span>
          <button value="cancel" class="text-button" autofocus>取消</button>
          <button id="delete-book-confirm" type="button" class="danger-button">删除图书</button>
        </div>
      </form>
    </dialog>

    <dialog id="shelf-dialog" class="annotation-dialog" aria-labelledby="shelf-dialog-title">
      <form id="shelf-form">
        <div class="annotation-header"><h2 id="shelf-dialog-title">添加书架</h2></div>
        <label class="shelf-name-label">书架名称<input id="shelf-name" required maxlength="80" placeholder="例如：文学、历史、想读的书" /></label>
        <div class="shelf-cover-editor">
          <div id="shelf-cover-preview" aria-label="书架封面预览"></div>
          <div class="shelf-cover-controls">
            <label for="shelf-cover-source">书架封面</label>
            <select id="shelf-cover-source" aria-label="选择书架封面"></select>
            <button id="shelf-cover-upload" class="text-button" type="button"><span data-icon="plus"></span>上传本地图片</button>
            <input id="shelf-cover-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden />
          </div>
        </div>
        <p>选择放入书架的图书（可多选）</p>
        <div id="shelf-books" class="shelf-books"></div>
        <p id="shelf-error" role="alert"></p>
        <div class="annotation-actions">
          <span></span><button id="shelf-cancel" type="button" class="text-button">取消</button>
          <button id="shelf-save" type="submit" class="primary">保存书架</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" popover="manual" hidden></div>
    <div id="busy" class="busy" hidden>
      <span class="spinner"></span><span id="busy-label">正在处理电子书…</span>
    </div>
  </body>
</html>
